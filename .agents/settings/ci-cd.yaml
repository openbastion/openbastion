# La CI existe depuis ADR-0047 : .github/workflows/ci.yml (GitHub Actions), sur chaque push vers main
# et chaque pull request. Ce fichier dit ce qu'elle lance ; la vérité est le workflow.
ci:
  exists: true
  workflow: .github/workflows/ci.yml
  jobs:
    go: [make build vet, "gofmt -l sur tout le dépôt → vide", make test]          # sans base
    race: ["make test GOFLAGS=-race"]
    integration: ["make build", "go test ./test/integration/... -timeout=900s"]  # sans base
    postgres: ["make test (avec TEST_DATABASE_URL)", make test-postgres, "intégration avec base, purgée avant"]
    ui: [make ui-test ui-build]
    vulnerabilities: [make vuln]          # govulncheck v1.9.0 sur chaque module + npm audit ; aussi chaque lundi (cron), ADR-0052
  pinned:                               # par empreinte, l'étiquette en commentaire dans le workflow
    actions/checkout: v7.0.1
    actions/setup-go: v7.0.0
    actions/setup-node: v7.1.0
    postgres: "16 (empreinte d'index)"
  permissions: "contents: read ; persist-credentials: false"
  not_in_ci:
    - make test-compose                 # Docker requis ; vérification avant un jalon (ADR-0033)
    - construction et analyse des images (Trivy, Grype) : à décider
  never_in_ci:
    - secrets réels ; la PKI et les clés des tests se génèrent dans le job et n'en sortent pas
  required_checks:                      # NON appliqués aujourd'hui : la CI signale sans bloquer
    names:                              # noms exacts des check runs (app github-actions, id 15368)
      - "build, vet, gofmt, unit"
      - "unit tests under -race"
      - "integration on real processes, without a database"
      - "PostgreSQL 16 — unit, dedicated, integration"
      - "Admin UI — Vitest and build"
    ruleset: "posé par Bony Kiss le 31 octobre 2026 sur main ; GitHub affiche « won't be enforced on this private repository until you upgrade this organization account to GitHub Team »"
    bypass: "Repository admin — une fois appliqué, les pushes directs sous un compte administrateur passent : la livraison commit-et-push sur main (policies/release-management.md) reste valable ; la règle protège main des autres contributeurs, pas d'un push direct raté"
    api: "le jeton du codespace ne lit ni la protection (403 integration) ni les rulesets (403 offre) : vérifier dans l'interface"
cd:
  exists: false
  deployment_reference: deploy/docker-compose (ADR-0033) ; pas de Helm ni de Kubernetes dans le dépôt
  delivery: commit et push sur main, vérifiés (policies/release-management.md) ; tags et releases sur demande seulement
