# La CI existe depuis ADR-0047 : .github/workflows/ci.yml (GitHub Actions), sur chaque push vers main
# et chaque pull request. Ce fichier dit ce qu'elle lance ; la vérité est le workflow.
ci:
  exists: true
  workflow: .github/workflows/ci.yml
  reusable_workflows:
    go: .github/workflows/go.yml              # version, build, vet, gofmt, unit, -race
    integration: .github/workflows/integration.yml
    postgres: .github/workflows/postgres.yml
    frontend: .github/workflows/frontend.yml
    security: .github/workflows/security.yml
    containers: .github/workflows/containers.yml
  local_actions:
    setup_go: .github/actions/setup-go/action.yml
    setup_node: .github/actions/setup-node/action.yml
  required_gate:
    job: "CI / Required checks"
    behavior: "if: always() ; échec si un workflow amont n'a pas exactement le résultat success"
    dependencies: [go, integration, postgres, frontend, security, containers]
  jobs:
    version: [make version-check]      # ADR-0063 : VERSION est SemVer ; sur un tag v*, le tag est v+VERSION
    go: [make proto-tools proto-lint build vet, "gofmt -l sur tout le dépôt → vide", make test]
    race: ["make proto-tools test GOFLAGS=-race"]
    integration: ["make proto-tools proto-lint build", "go test ./test/integration/... -timeout=900s"]
    postgres: ["make proto-tools build", "make test (avec TEST_DATABASE_URL)", make test-postgres, "intégration avec base, purgée avant"]
    ui: [make ui-test ui-build]
    vulnerabilities: [make proto-tools vuln]  # govulncheck v1.9.0 sur chaque module + npm audit ; aussi chaque lundi (cron), ADR-0052
    images: ["make scan-images TRIVY=…"]  # ADR-0060 : image runtime + postgres:16 épinglée ; HIGH/CRITICAL corrigée = échec
  trivy:                                # jamais trivy-action ni setup-trivy (CVE-2026-33634) : l'archive, vérifiée contre TRIVY_SHA256 du workflow
    version: 0.76.1
    sha256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
    mise_a_jour: "à la main (Dependabot ne le fait pas) : nouvelle version d'au moins 7 jours, empreinte relevée de trois façons concordantes (GitHub, fichier d'empreintes, calcul)"
  pinned:                               # par empreinte, l'étiquette en commentaire dans le workflow
    actions/checkout: v7.0.1
    actions/setup-go: v7.0.0
    actions/setup-node: v7.1.0
    postgres: "16 (empreinte d'index)"
  permissions: "contents: read ; persist-credentials: false"
  dependabot:                           # .github/dependabot.yml, ADR-0059
    sources: [gomod (17 modules), npm (2), github-actions, docker (Dockerfile), docker-compose]
    rythme: chaque lundi ; une version n'est proposée qu'à 7 jours (cooldown), sauf mise à jour de sécurité
    forme: une pull request par dépendance, la même dans tous les modules (group-by dependency-name) ; jamais en masse
    fusion: humaine, après la CI entière ; un module Go ajouté s'ajoute à la liste des répertoires
    hors_portee: [go.work, GO_VERSION de la CI, empreintes écrites dans les tests (OpenBao de transit_flow_test.go)]
    reglage_du_depot: "alertes et mises à jour de sécurité Dependabot : Settings → Code security, à activer par le propriétaire"
  not_in_ci:
    - make test-compose                 # Docker requis ; vérification avant un jalon (ADR-0033)
  never_in_ci:
    - secrets réels ; la PKI et les clés des tests se génèrent dans le job et n'en sortent pas
  required_checks:                      # Migration différée jusqu'à validation du nouveau check sur une PR réelle
    current_names:                      # contextes historiques actuellement déclarés dans le ruleset
      - "build, vet, gofmt, unit"
      - "unit tests under -race"
      - "integration on real processes, without a database"
      - "PostgreSQL 16 — unit, dedicated, integration"
      - "Admin UI — Vitest and build"
      - "govulncheck and npm audit"
      - "Images — Trivy (HIGH, CRITICAL)"
      - "version — VERSION is SemVer, a tag is its release"
    target_name: "CI / Required checks"
    migration: "Après preuve du nom exact, de l'application émettrice et du fail-closed sur une PR réelle ; ne pas modifier les règles pendant cet incrément"
    ruleset: "posé par Bony Kiss le 31 octobre 2026 sur main ; GitHub affiche « won't be enforced on this private repository until you upgrade this organization account to GitHub Team »"
    bypass: "Repository admin — appliqué : le 7 novembre 2026, chaque push direct sur main a répondu « Bypassed rule violations » (PR exigée, 8 contrôles requis). Depuis, la livraison passe par une pull request (policies/release-management.md) : le contournement n'est pas une voie de livraison"
    api: "le jeton du codespace ne lit ni la protection (403 integration) ni les rulesets (403 offre) : vérifier dans l'interface"
cd:
  exists: false
  deployment_reference: deploy/docker-compose (ADR-0033) ; pas de Helm ni de Kubernetes dans le dépôt
  delivery: une pull request vers main par modification vérifiée, fusionnée par l'utilisateur (policies/release-management.md) ; tags et releases sur demande seulement
