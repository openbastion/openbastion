# Le projet tel qu'il est. Réglage : une demande explicite de l'utilisateur l'emporte (jamais sur une policy).
# Un fait qui change dans le dépôt se corrige ici dans le même commit.
project:
  name: OpenBastion
  kind: PAM (Privileged Access Management) open source, cloud-native
  license: AGPL-3.0
  original: true            # aucun code ni texte d'un produit PAM commercial (policies/licensing-agpl-3.0.md)
  owner: Bony Kiss          # s'exprime en français ; valide les ADR et les choix irréversibles
  repository: github.com/openbastion/openbastion
  default_branch: main
  languages:
    backend: Go 1.22 (un module par composant, go.work)
    frontend: TypeScript + React + Vite (web/admin-ui, ADR-0036)
  mvp_protocols: [ssh, sftp, scp]   # SFTP et SCP depuis ADR-0038 ; le reste du périmètre est sur la feuille de route
  version: VERSION          # Semantic Versioning (ADR-0063) ; 0.0.1-dev aujourd'hui ; jalons MVP → v0.0.1 → v0.0.2
  roadmap: docs/roadmap.md
  truth:
    decisions: docs/adr/
    public_api: docs/api/rest/openapi.yaml
    data_model: docs/architecture/data-architecture.md
    internal_messages: docs/api/grpc/README.md
    state_and_limits: NOTES_SANDBOX.md

services:                    # identité mTLS = nom ; ports par défaut (architecture/service-pattern.md)
  api-gateway:      {path: services/access/api-gateway,              port: 8080, public: true}
  password-vault:   {path: services/vault/password-vault,            port: 8081}
  audit-service:    {path: services/recording-audit/audit-service,   port: 8082}
  authorization:    {path: services/access/authorization,            port: 8083}
  session-broker:   {path: services/access/session-broker,           port: 8084}
  ssh-proxy:        {path: services/proxy/ssh-proxy,                 port: 8085, ssh_port: 2222, single_instance: true}
  rdp-vnc-proxy:    {path: services/proxy/rdp-vnc-proxy,             port: 8090, screen_protocols: [vnc], rdp_enabled: false}
  authentication:   {path: services/access/authentication,           port: 8086}
  command-recorder: {path: services/recording-audit/command-recorder, port: 8087}
  video-recorder:   {path: services/recording-audit/video-recorder, port: 8088, grpc_port: 8089}

libraries:
  pkg/proxycore: pipeline proxy commun (ADR-0006)
  pkg/rdp: X.224 HYBRID + TLS épinglé, CredSSP NTLM v5/v6 avec authInfo scellé, MCS/GCC et Channel Connection stricts, Client Info Unicode sur canal MCS I/O 1003, mot de passe transitoire dans TS_INFO_PACKET sous TLS et non conservé dans la session (incrément 20), codec Demand Active/Confirm Active verrouillé par licensingComplete ; Licensing, finalisation, affichage et entrée restent à implémenter (ADR-0071)
  pkg/vnc: client RFB 3.8 borné, VeNCrypt/X.509, pin TLS et framebuffer PNG ; adapté à proxycore.ScreenCodec par le module engine RDP/VNC (ADR-0071)
  services/proxy/rdp-vnc-proxy: runtime exécutable, tickets à usage unique, relais WebSocket binaire et cycle de vie proxycore ; VNC seulement, RDP désactivé
  pkg/mtls: identité par certificat (ADR-0010) — stdlib seulement
  pkg/migrate: migrations versionnées (ADR-0030) — stdlib seulement
  pkg/refusalbudget: budget des refus audités (ADR-0020, ADR-0024) — stdlib seulement
  pkg/webhook: webhook sortant signé — URL vérifiée et jamais écrite, pas de redirection (ADR-0013, ADR-0045) — stdlib seulement
  pkg/transit: client du moteur Transit d'OpenBao — clés de données enveloppées sous une clé qui ne quitte pas le serveur (ADR-0049) — stdlib seulement
  pkg/buildinfo: la version estampillée à la construction et sa grammaire SemVer (ADR-0063) — stdlib seulement
  pkg/hostkey: reconnaître une cible SSH — clé épinglée ou autorité de certificats pour un nom (ADR-0039, ADR-0048) ; golang.org/x/crypto/ssh, comme le Vault et le proxy
tools:
  cli/openbastion-cli: exploitation sous l'identité admin-cli (ADR-0033)
