# Défauts de sécurité : le plus strict par défaut ; le mode faible se demande par son nom et s'annonce ;
# une valeur inconnue ou hors bornes est fatale au démarrage. Source : le main.go de chaque service.
strict_defaults:
  INTERNAL_TLS:            {default: required, weak: disabled, note: "dev local et tests seulement"}
  RECORDING_POLICY:        {default: required, weak: best-effort, note: "ADR-0008 ; required sans RECORDER_URL : le proxy refuse de démarrer"}
  BREAKGLASS_MAX_MINUTES:  {default: "absent ou 0 = désactivé", note: "ADR-0009"}
  BREAKGLASS_ENABLED:      {default: false, service: ssh-proxy}
  BREAKGLASS_APPROVAL:     {default: required, weak: disabled, note: "ADR-0011"}
  BREAKGLASS_APPROVAL_WINDOW_MINUTES: {min: 1, max: 1440}
  BREAKGLASS_MAX_PENDING_PER_REQUESTER: {default: 3, min: 1, max: 100}
  BREAKGLASS_NOTIFY_URL:   {default: "absente = pas de notification (annoncé)", secret: true}
  BREAKGLASS_NOTIFY_SECRET: {min_bytes: 32, note: "sans URL : fatal", secret: true}
  ALERT_NOTIFY_URL:        {default: "absente = pas de poussée (annoncé)", service: audit-service, secret: true, note: "ADR-0045 ; sans ALERT_NOTIFY_SECRET : fatal"}
  ALERT_NOTIFY_SECRET:     {min_bytes: 32, service: audit-service, secret: true, note: "obligatoire avec l'URL ; sans URL : fatal"}
  ALERT_NOTIFY_RETRY_SECONDS: {default: 30, min: 1, max: 600, service: audit-service, note: "double à chaque renvoi, 5 tentatives ; sans URL : fatal"}
  SESSION_REQUEST_BURST:   {default: 10, min: 1, max: 1000}
  SESSION_REQUEST_RATE_PER_MINUTE: {default: 6, min: 1, max: 600}
  SESSION_ACTION_BURST:    {default: 10, min: 1, max: 1000}
  SESSION_ACTION_RATE_PER_MINUTE: {default: 6, min: 1, max: 600}
  VAULT_ACCOUNT_ACTION_BURST: {default: 10, min: 1, max: 1000, note: "PUT /vault/accounts/{id}/approval : par identité"}
  VAULT_ACCOUNT_ACTION_RATE_PER_MINUTE: {default: 6, min: 1, max: 600, note: "PUT /vault/accounts/{id}/approval : par identité"}
  CLIENT_LOGIN_BURST:      {min: 1, max: 100}
  CLIENT_LOGIN_RATE_PER_MINUTE: {min: 1, max: 60}
  CLIENT_REQUEST_BURST:    {min: 1, max: 10000}
  CLIENT_REQUEST_RATE_PER_MINUTE: {min: 1, max: 6000}
  TRUSTED_PROXY_CIDRS:     {default: "personne", note: "ADR-0015 ; une confiance trop large est fatale"}
  SSH_PROXY_URLS:          {default: "SSH_PROXY_URL, une instance", min: 1, max: 16, service: session-broker, note: "ADR-0046 ; avec SSH_PROXY_URL, doublon ou entrée illisible : fatal ; révocation confirmée par toutes"}
  SSH_PUBLIC_ENDPOINT:     {default: "127.0.0.1:SSH_PORT", format: "hôte:port", service: ssh-proxy, note: "ADR-0046 ; illisible : fatal"}
  TRANSIT_TOKEN_RELOAD_SECONDS: {default: 30, min: 1, max: 3600, service: "password-vault, command-recorder, video-recorder", note: "ADR-0056 ; un nouveau jeton n'est pris qu'accepté par Transit"}
  S3_ALLOW_HTTP:           {default: false, weak: true, service: video-recorder, note: "développement seulement ; HTTPS et identité SeaweedFS attendus en déploiement"}
  S3_CREATE_BUCKET:        {default: false, service: video-recorder, note: "requiert le privilège Admin du stockage S3"}
  KEY_REWRAP_SWEEP_SECONDS: {default: 60, min: 1, max: 3600, service: "password-vault, command-recorder", note: "ADR-0055 ; seulement avec Transit et KMS_KEY_HEX gardé"}
  SESSION_EXPIRY_SWEEP_SECONDS: {default: 30, min: 1, max: 3600, note: "ADR-0034"}
  ROTATION_SWEEP_SECONDS:  {default: 300, min: 1, max: 86400, service: password-vault, note: "ADR-0040 ; sans interrupteur"}
  ROTATION_WINDOW_UTC:     {default: "à toute heure", format: "HH:MM-HH:MM", service: password-vault, note: "ADR-0041 ; illisible ou nulle : fatal"}
  ROTATION_ALERT_AFTER_FAILURES: {default: 3, min: 1, max: 100, service: password-vault, note: "ADR-0041"}
  AUDIT_RETENTION_MONTHS:  {default: "désactivé", min: 1, max: 120, note: "ADR-0032, avec AUDIT_ARCHIVE_DIR"}
startup_keys:              # obligatoires avec DATABASE_URL ; jamais dans le dépôt
  - KMS_KEY_HEX             # password-vault, command-recorder — ou Transit (ADR-0049) : TRANSIT_ADDR + TRANSIT_KEY + TRANSIT_TOKEN_FILE (fichier 0600) ou AppRole TRANSIT_ROLE_ID_FILE + TRANSIT_SECRET_ID_FILE (fichiers 0600, ADR-0058 ; jamais les deux), aller-retour au démarrage ; avec les deux, KMS_KEY_HEX ne fait plus que lire
  - TRANSIT                 # video-recorder (ADR-0070 en déploiement ; clé locale réservée au développement) : TRANSIT_ADDR + TRANSIT_KEY + TRANSIT_TOKEN_FILE ou AppRole, TLS CA, aller-retour au démarrage
  - TOKEN_SIGNING_KEY_HEX   # authentication
  - AUDIT_CHAIN_KEY_HEX     # audit-service (ADR-0027)
optional_keys:             # requises seulement avec la fonction qu'elles servent ; jamais dans le dépôt
  - MFA_SECRET_KEY_HEX      # authentication (ADR-0062) : scelle les secrets TOTP, obligatoire avec MFA_REQUIRED_ROLES (et réciproquement) ; la perdre rend tous les secrets illisibles
  - S3_ACCESS_KEY + S3_SECRET_KEY # video-recorder : compte S3 dédié ; en Compose, identité SeaweedFS actuellement administratrice pour créer le bucket
optional_secrets:          # fichiers 0600, jamais une variable d'environnement qui porte la valeur
  - IDENTITY_PROVIDERS_FILE # authentication (ADR-0076) : pas un secret, mais modifiable par son seul propriétaire ; ses client_secret_file et bind_password_file en 0600 ; exclut OIDC_* et LDAP_*
  - SEARCH_AUDIT_KEY_FILE # command-recorder (ADR-0080) : 32 octets en hexadécimal, clé de l'empreinte du texte cherché écrite à l'audit ; absente, la recherche répond 404
  - LDAP_BIND_PASSWORD_FILE # authentication (ADR-0061) : le compte de service de l'annuaire, relu à chaque connexion ; avec LDAP_URL, LDAP_SCHEMA, LDAP_BIND_DN, LDAP_USER_BASE_DN, LDAP_GROUP_BASE_DN, LDAP_ROLE_MAP_FILE, tout ou rien
never:
  - InsecureSkipVerify
  - un mot de passe d'annuaire en clair (ldap:// sans StartTLS) ou un bind avec un mot de passe vide (ADR-0061)
  - TLS < 1.3 entre services
  - ssh.InsecureIgnoreHostKey vers une cible (ADR-0039)
  - un fournisseur OIDC qui démarre avec un autre émetteur que celui retenu, sans changement déclaré et écrit à l'audit d'abord (ADR-0078)
  - "* dans une politique par défaut"
  - un secret dans un journal, une URL, un argument, une erreur ou une réponse
