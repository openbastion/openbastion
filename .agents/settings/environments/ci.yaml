# Aucune CI n'existe aujourd'hui (settings/ci-cd.yaml). Ce que son environnement devra fournir :
ci:
  exists: false
  go: "1.22 ou plus"
  node: "24 (constaté en local)"
  postgresql: "16, en service du job ; TEST_DATABASE_URL vers lui ; base jetable"
  internal_tls: required   # la PKI de test se génère dans le job (make pki)
  network: accès aux registres de modules Go et npm
  secrets: aucun secret réel ; uniquement des valeurs générées dans le job
