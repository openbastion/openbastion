# L'environnement de la CI (ADR-0047, .github/workflows/ci.yml).
ci:
  exists: true
  runner: ubuntu-24.04
  go: "1.27.1 (celle de la vérification locale ; les modules déclarent go 1.22)"
  node: "24.21.0"
  postgresql: "16, en service du job postgres, épinglé par empreinte ; TEST_DATABASE_URL vers lui ; base jetable"
  internal_tls: "les tests sous mTLS génèrent leur PKI eux-mêmes"
  network: "GOPROXY=direct comme le Makefile ; registre npm pour npm ci"
  secrets: aucun secret réel ; uniquement des valeurs générées dans le job
