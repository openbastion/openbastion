# Environnements de développement constatés. Vérifie avant de supposer : le répertoire courant peut changer.
codespace:
  root: /workspaces/openbastion
  go: "1.27 installé (modules en go 1.22), GOPATH=/go"
  setup: |
    export GOWORK=$PWD/go.work
    # a container Docker lost (« RWLayer … unexpectedly nil », seen twice) is removed first: test data only
    docker start obpg 2>/dev/null || { docker rm -f obpg 2>/dev/null; docker run -d --name obpg -e POSTGRES_USER=openbastion -e POSTGRES_PASSWORD=openbastion \
      -e POSTGRES_DB=openbastion -p 127.0.0.1:5432:5432 postgres:16; }
    export TEST_DATABASE_URL="postgres://openbastion:openbastion@127.0.0.1:5432/openbastion?sslmode=disable"
  module_cache: vide au départ ; make build le remplit (les tests d'intégration compilent avec GOPROXY=off)
  compose_firewall: |
    Deux conteneurs d'un même réseau Compose ne se joignent pas (iptables-legacy FORWARD DROP, ADR-0033).
    Pour make test-compose, l'utilisateur a autorisé une règle temporaire, posée puis retirée dans la même commande :
      sudo -n iptables-legacy -I FORWARD 1 -i br-+ -o br-+ -j ACCEPT
      ... make test-compose ...
      sudo -n iptables-legacy -D FORWARD -i br-+ -o br-+ -j ACCEPT
    Ne la laisse jamais en place.
wsl_mirrored:
  root: /home/eldorplus/openbastion
  setup: |
    # comme codespace pour PostgreSQL (conteneur obpg) ; ni buf ni psql sur l'hôte
    export TEST_DATABASE_URL="postgres://openbastion:openbastion@127.0.0.1:5432/openbastion?sslmode=disable"
    # sans buf, avec les *.pb.go déjà générés : make -o proto-gen <cible>
  loopback_pitfall: |
    Un port fermé de 127.0.0.1 ne répond pas (pas de RST) : connect attend au lieu d'échouer. Un test qui
    compte sur un refus immédiat attend donc son délai : donne-lui un amont qui répond (answeringUpstream).
  integration_timeout: make test-integration dépasse ici ses 300 s (398 s mesurées, sans échec) ; go test -timeout=1200s
  orphans_pitfall: |
    Un binaire de test tué ou arrivé au délai n'exécute pas ses t.Cleanup : ses services gardent leurs ports et
    faussent le passage suivant (502, create-user 400). Avant de relancer, cherche les exécutables sous /tmp/Test*.
cloud_sandbox:
  root: /home/claude/openbastion
  setup: |
    export GOWORK=/home/claude/openbastion/go.work GOPROXY=direct
    service postgresql start && sudo -u postgres psql -c "ALTER ROLE openbastion WITH PASSWORD 'openbastion';"
    export TEST_DATABASE_URL="postgres://openbastion:openbastion@127.0.0.1:5432/openbastion?sslmode=disable"
  network: restreint à une liste de domaines ; un refus se constate et se rapporte
  milestone_archive: zip sans .git, node_modules ni clés ; unzip -l … | grep -c '\.pem' = 0
base44_preview:
  compose: deploy/base44/docker-compose.yml   # le dépôt tel quel, go run, Vite en dev (AGENTS.md, Base44)
  entry: http://localhost:3000
  gateway: http://localhost:8080
  demo_account: operator / openbastion-demo   # valeur de développement locale, écrite dans le compose
  after_go_change: docker compose -f deploy/base44/docker-compose.yml restart <service>
  after_module_change: docker compose -f deploy/base44/docker-compose.yml up -d --build   # le job pki tourne sans réseau (network_mode none) et ne trouve que les modules de l'image ; un module nouveau le fait échouer, et sans pki ni SeaweedFS le Video Recorder redémarre en boucle (11 nov. 2026)
  screen_test: cd test/integration && BASE44_PREVIEW_URL=http://localhost:3000 go test . -run TestBase44Preview -v   # GOWORK absolu ; pile déjà démarrée
  ssh: 127.0.0.1:2222, ticket de POST /sessions/{id}/connect comme mot de passe ; cible demo-ssh-target (rien n'est exécuté)
  rate_limit_pitfall: la Gateway limite les connexions par adresse (5 puis 1/min) ; l'UI arrive d'une seule adresse
