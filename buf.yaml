version: v2

modules:
  - path: proto

lint:
  use:
    - STANDARD
  # Existing v1 contracts predate Buf's directory and RPC naming rules. Keep
  # the remaining standard checks enabled without rewriting public contracts.
  except:
    - PACKAGE_DIRECTORY_MATCH
    - SERVICE_SUFFIX
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME

breaking:
  use:
    - FILE
