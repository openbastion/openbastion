# ADR-0060: the findings Trivy reports that OpenBastion accepts, each with why, where and until when.
# Read by `make scan-images` (and so by the CI). An entry holds for its path only: the same
# vulnerability anywhere else — in an OpenBastion binary above all — still fails the gate. An entry
# expires: past its date it no longer hides anything, and the gate fails until it is looked at again.
#
# postgres:16 (digest pinned in deploy/*/docker-compose.yml), usr/local/bin/gosu: the Go standard
# library v1.24.6 that the upstream image builds gosu with. gosu runs once, as root, at the start of
# the container, to exec postgres as the postgres user: no network, no TLS, no parsing of anything
# but its arguments. Not reachable from what it does (judged, not proven). Nothing to fix on our
# side but the image: Dependabot proposes a new digest once upstream rebuilds (ADR-0059), and the
# entries go. Measured on 31 October 2026 with Trivy 0.76.1: 26 findings (HIGH 25, CRITICAL 1), the
# Debian packages of the image: 0.
vulnerabilities:
  - id: CVE-2025-61726
    paths: ["usr/local/bin/gosu"]
    statement: Go stdlib v1.24.6 in gosu of postgres:16, not reachable from what gosu does (see above)
    expired_at: 2027-01-31
  - id: CVE-2025-61729
    paths: ["usr/local/bin/gosu"]
    statement: Go stdlib v1.24.6 in gosu of postgres:16, not reachable from what gosu does (see above)
