# ADR-0060: the findings Trivy reports that OpenBastion accepts, each with why, where and until when.
# Read by `make scan-images` (and so by the CI). An entry holds for its path only: the same
# vulnerability anywhere else — in an OpenBastion binary above all — still fails the gate. An entry
# expires: past its date it no longer hides anything, and the gate fails until it is looked at again.
#
# usr/local/bin/gosu in the pinned upstream PostgreSQL image: the Go standard library v1.24.6
# embedded by upstream. gosu runs once, as root, to exec postgres as the postgres user; it does
# not accept network input. These findings are judged not reachable from gosu's limited role,
# not proven unexploitable. The exception is path-scoped and expires 31 January 2027.
# Debian OS packages are upgraded from the security repository in
# deploy/docker-compose/postgres/Dockerfile and remain subject to the strict HIGH/CRITICAL gate.
vulnerabilities:
  - id: CVE-2025-61726
    paths: ["usr/local/bin/gosu"]
    statement: Go stdlib v1.24.6 in gosu of postgres:16, not reachable from what gosu does (see above)
    expired_at: 2027-01-31
  - id: CVE-2025-61729
    paths: ["usr/local/bin/gosu"]
    statement: Go stdlib v1.24.6 in gosu of postgres:16, not reachable from what gosu does (see above)
    expired_at: 2027-01-31
