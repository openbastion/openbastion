syntax = "proto3";
package openbastion.recording.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/openbastion/openbastion/proto/recording/v1;recordingv1";

service SessionRecording {
  rpc StreamCommandEntries(stream CommandEntry) returns (StreamAck);
  // Ancienne signature conservée pour compatibilité, non servie. L'ingestion
  // vidéo acquittée utilise VideoRecording.StreamVideoSegments.
  rpc StreamVideoFrames(stream VideoFrame) returns (StreamAck);
}

// Ingestion et lecture des enregistrements vidéo. L'identité de service de
// l'appelant vient exclusivement du certificat mTLS, jamais des messages.
service VideoRecording {
  // Le proxy ne reçoit d'accusé qu'après persistance chiffrée dans le stockage
  // objet et validation des métadonnées en PostgreSQL.
  rpc StreamVideoSegments(stream VideoSegment) returns (stream VideoSegmentAck);
  // Appelé uniquement par la Gateway après vérification du jeton utilisateur.
  rpc GetVideoSegment(GetVideoSegmentRequest) returns (GetVideoSegmentResponse);
  // Marqueur latéral idempotent, écrit avant l’injection de secret par le proxy.
  rpc RecordVideoEvent(RecordVideoEventRequest) returns (RecordVideoEventResponse);
  // Lecture paginée des marqueurs, uniquement via l’API Gateway.
  rpc GetVideoEvents(GetVideoEventsRequest) returns (GetVideoEventsResponse);
  // Vérifie les dépendances avant l'admission d'une session enregistrée.
  rpc CheckReadiness(CheckVideoRecorderReadinessRequest) returns (CheckVideoRecorderReadinessResponse);
}

message CommandEntry {
  string session_id = 1;
  google.protobuf.Timestamp ts = 2;
  string command = 3;
}

message VideoFrame {
  string session_id = 1;
  google.protobuf.Timestamp ts = 2;
  bytes frame_data = 3;
  string codec = 4;
}

message StreamAck {
  int64 entries_received = 1;
}

message VideoFrameData {
  google.protobuf.Timestamp ts = 1;
  bytes frame_data = 2;
  // png (une image clé, le PNG), png-delta-v1 (une image partielle, ADR-0092 : le message
  // FRAME_DELTA) ou clipboard-text-v1 (un texte du presse-papiers, ADR-0096 : le message
  // CLIPBOARD). Voir docs/api/grpc/README.md.
  string codec = 3;
}

message VideoSegment {
  string session_id = 1;
  int64 first_sequence = 2;
  int64 last_sequence = 3;
  repeated VideoFrameData frames = 4;
  bool terminal = 5;
  int64 terminal_through_sequence = 6;
}

message VideoSegmentAck {
  string session_id = 1;
  int64 through_sequence = 2;
  bool complete = 3;
}

message GetVideoSegmentRequest {
  string session_id = 1;
  int64 first_sequence = 2;
  // Construit par la Gateway à partir du jeton vérifié, jamais du client.
  string actor_user_id = 3;
  repeated string actor_roles = 4;
}

message GetVideoSegmentResponse {
  string session_id = 1;
  int64 first_sequence = 2;
  int64 last_sequence = 3;
  repeated VideoFrameData frames = 4;
  bool complete = 5;
}

message CheckVideoRecorderReadinessRequest {}

message CheckVideoRecorderReadinessResponse {
  bool ready = 1;
}

// Lecture de l'enregistrement texte d'une session, par un auditeur — le
// pendant « lecture » de StreamCommandEntries. Appelé par l'API Gateway, qui
// transmet l'utilisateur et les rôles vérifiés du jeton (jamais ceux fournis
// par le client). L'accès est décidé par le Command Recorder lui-même via
// Authorization : action recording:session:read sur la ressource
// recording:session:{id}. Chaque page servie est un événement d'audit
// recording.read au nom de actor_user_id, écrit avant d'être servie ; sans
// cet événement, la page n'est pas servie (ADR-0022).
service SessionRecordingQuery {
  rpc GetCommandRecording(GetCommandRecordingRequest) returns (GetCommandRecordingResponse);
}

message GetCommandRecordingRequest {
  string session_id = 1;
  repeated string actor_roles = 2;
  int32 page = 3;       // < 1 est ramené à 1
  int32 page_size = 4;  // < 1 → 20 ; > 100 → 100 (comme les listes de docs/api/rest/openapi.yaml)
  string actor_user_id = 5;  // l'utilisateur vérifié par le Gateway ; vide ⇒ refusé (ADR-0022)
}

message GetCommandRecordingResponse {
  string session_id = 1;
  repeated CommandEntry entries = 2;  // dans l'ordre d'enregistrement (ts, puis insertion)
  int32 page = 3;                     // la page réellement servie, pas la demandée
  int32 page_size = 4;
  int64 total_entries = 5;
}


message RecordVideoEventRequest {
  string event_id = 1;
  string session_id = 2;
  string event_type = 3;          // secret_injection_started (source vault) or secret_paste_started (source operator, ADR-0133)
  string protocol = 4;
  string source = 5;
  string account_id = 6;
  // An operator's password (source operator, ADR-0133 §4): its size and its salted fingerprint,
  // hex SHA-256(salt || text), never the text. Empty for a Vault secret.
  uint32 paste_bytes = 7;
  string paste_salt = 8;
  string paste_sha256 = 9;
}

message RecordVideoEventResponse {
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
}

message GetVideoEventsRequest {
  string session_id = 1;
  string actor_user_id = 2;
  repeated string actor_roles = 3;
  string cursor = 4;
  int32 limit = 5;
}

message VideoRecordingEvent {
  string event_id = 1;
  string session_id = 2;
  string event_type = 3;
  string protocol = 4;
  string source = 5;
  string account_id = 6;
  google.protobuf.Timestamp occurred_at = 7;
  uint32 paste_bytes = 8;   // ADR-0133: an operator's password, its size and salted fingerprint
  string paste_salt = 9;
  string paste_sha256 = 10;
}

message GetVideoEventsResponse {
  repeated VideoRecordingEvent events = 1;
  string next_cursor = 2;
}
