syntax = "proto3";
package openbastion.agent.v1;
import "google/protobuf/timestamp.proto";
option go_package = "github.com/openbastion/openbastion/proto/agent/v1;agentv1";

service AgentEnrollment {
  // Bootstrap uses server-authenticated TLS and a one-time enrollment token.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // Renewal requires the currently valid agent certificate (mTLS).
  rpc RenewCertificate(RenewCertificateRequest) returns (EnrollResponse);
}
message EnrollRequest {
  string agent_id = 1;
  string enrollment_token = 2;
  bytes csr_der = 3;
}
message RenewCertificateRequest { bytes csr_der = 1; }
message EnrollResponse {
  string agent_id = 1;
  bytes certificate_der = 2;
  google.protobuf.Timestamp not_before = 3;
  google.protobuf.Timestamp not_after = 4;
}
