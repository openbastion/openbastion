# OpenBastion in the Base44 sandbox — a DEVELOPMENT stack, not a deployment.
#
# It runs the CLONED SOURCE, exactly like the repository's own `make run-<service>`: every Go
# service is a plain `go run` over the bind-mounted repository, the Admin UI is the Vite dev
# server (HMR on the files you edit), and PostgreSQL / the internal PKI / mutual TLS are the
# real ones from deploy/docker-compose/docker-compose.yml (ADR-0010, ADR-0033).
#
#   docker compose -f deploy/base44/docker-compose.yml up -d --build
#
# Entry point: the Admin UI on host port 3000 (it proxies /auth, /sessions, /vault, /policies to
# the API Gateway, so the UI keeps ONE origin as in production). The public API itself is on
# host port 8080. The idempotent `seed` service creates the first operator (no user exists on a
# new installation) — its credentials are OPERATOR_USERNAME/OPERATOR_PASSWORD below.
#
# The keys and database passwords below are LOCAL DEVELOPMENT VALUES generated for this sandbox.
# They protect nothing outside it: a real installation draws its own with
# deploy/docker-compose/init.sh (ADR-0033). No external service is involved — nothing to ask the
# user for.
name: openbastion

x-go: &go
  image: openbastion:base44-dev
  build:
    # Paths in this file are relative to its own directory (deploy/base44/).
    context: ../..
    dockerfile: deploy/base44/Dockerfile
  restart: on-failure
  working_dir: /src
  networks: [internal]
  environment: &go-env
    GOWORK: /src/go.work
    GOFLAGS: -buildvcs=false
    # Mutual TLS between services, as in every other environment (ADR-0010): each service reads
    # its own identity under /pki/<service>.
    INTERNAL_TLS: required
    TLS_CERT_FILE: /pki/cert.pem
    TLS_KEY_FILE: /pki/key.pem
    TLS_CA_FILE: /pki/ca.pem

x-db-passwords: &db-passwords
  PG_PASSWORD_AUTHENTICATION: ob-dev-authentication
  PG_PASSWORD_AUTHORIZATION: ob-dev-authorization
  PG_PASSWORD_SESSION_BROKER: ob-dev-session-broker
  PG_PASSWORD_PASSWORD_VAULT: ob-dev-password-vault
  PG_PASSWORD_AUDIT_SERVICE: ob-dev-audit-service
  PG_PASSWORD_COMMAND_RECORDER: ob-dev-command-recorder
  PG_PASSWORD_VIDEO_RECORDER: ob-dev-video-recorder

services:
  # The certificate job, at every `up`: it keeps the authority and renews the services'
  # certificates (deploy/docker-compose/pki.sh, unchanged).
  pki:
    <<: *go
    restart: "no"
    command:
      ["sh", "-ec", "go build -o /usr/local/bin/openbastion-pki github.com/openbastion/openbastion/pkg/mtls/cmd/openbastion-pki && exec sh /deploy/pki.sh"]
    environment:
      <<: *go-env
      OB_CERT_TTL: 720h
    volumes:
      - ../..:/src
      - pki-ca:/ca
      - pki:/pki
      - ../../deploy/docker-compose/pki.sh:/deploy/pki.sh:ro
    # The certificate job touches no network at all (it inherits `networks` from the anchor).
    networks: []
    network_mode: none

  # The contracts, at every `up`: the *.pb.go packages are not generated in git (make proto-gen,
  # .gitignore), and every Go service compiles against them — generated into the bind-mounted
  # source so the services' `go run` sees them.
  proto:
    <<: *go
    restart: "no"
    command: ["sh", "-ec", "buf generate"]
    volumes:
      - ../..:/src
    networks: []
    network_mode: none

  postgres:
    image: openbastion-postgres:16
    build:
      context: ../..
      dockerfile: deploy/docker-compose/postgres/Dockerfile
    restart: on-failure
    environment:
      POSTGRES_USER: openbastion
      POSTGRES_PASSWORD: ob-dev-superuser
      POSTGRES_DB: postgres
      <<: *db-passwords
    volumes:
      - postgres:/var/lib/postgresql/data
      - ../../deploy/docker-compose/postgres-init.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >
          for user in authentication authorization session_broker password_vault audit_service command_recorder video_recorder; do
            case "$$user" in
              authentication) pw='ob-dev-authentication' ;;
              authorization) pw='ob-dev-authorization' ;;
              session_broker) pw='ob-dev-session-broker' ;;
              password_vault) pw='ob-dev-password-vault' ;;
              audit_service) pw='ob-dev-audit-service' ;;
              command_recorder) pw='ob-dev-command-recorder' ;;
              video_recorder) pw='ob-dev-video-recorder' ;;
            esac
            PGPASSWORD="$$pw" pg_isready -h 127.0.0.1 -U "$$user" -d "$$user" >/dev/null || exit 1;
          done
      interval: 3s
      timeout: 5s
      retries: 30
    networks: [internal]

  authentication:
    <<: *go
    command: ["go", "run", "github.com/openbastion/openbastion/services/access/authentication/cmd/authentication"]
    environment:
      <<: *go-env
      PORT: "8086"
      DATABASE_URL: postgres://authentication:ob-dev-authentication@postgres:5432/authentication?sslmode=disable
      TOKEN_SIGNING_KEY_HEX: 2239acb116a20ab72fe698d0fbf018a7180072508ab7ce0ab7e9040615956892
      # Every login is written to the audit before its token is issued (ADR-0064).
      AUDIT_URL: https://audit-service:8082
      # No demonstration user (ADR-0033): `seed` makes the operator. Its account has a known password,
      # and creating it again on an existing database stops this service.
      SKIP_DEMO_SEED: "1"
    volumes:
      - ../..:/src
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: authentication}}
    depends_on:
      postgres: {condition: service_healthy}
      proto: {condition: service_completed_successfully}
      pki: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8086"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 120s

  authorization:
    <<: *go
    command: ["go", "run", "github.com/openbastion/openbastion/services/access/authorization/cmd/authorization"]
    environment:
      <<: *go-env
      PORT: "8083"
      DATABASE_URL: postgres://authorization:ob-dev-authorization@postgres:5432/authorization?sslmode=disable
      BOOTSTRAP_ADMIN_ROLE: platform-admin
    volumes:
      - ../..:/src
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: authorization}}
    depends_on:
      postgres: {condition: service_healthy}
      proto: {condition: service_completed_successfully}
      pki: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 120s

  audit-service:
    <<: *go
    command: ["go", "run", "github.com/openbastion/openbastion/services/recording-audit/audit-service/cmd/audit-service"]
    environment:
      <<: *go-env
      PORT: "8082"
      DATABASE_URL: postgres://audit_service:ob-dev-audit-service@postgres:5432/audit_service?sslmode=disable
      AUDIT_CHAIN_KEY_HEX: d9ca615ccfc46eeac66997c9a31d89c164228270b0d1ab311368d3f1bd994687
      AUDIT_ANCHOR_FILE: /var/lib/openbastion/anchors/anchors.jsonl
    volumes:
      - ../..:/src
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: audit-service}}
      - anchors:/var/lib/openbastion/anchors
    depends_on:
      postgres: {condition: service_healthy}
      proto: {condition: service_completed_successfully}
      pki: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 120s

  password-vault:
    <<: *go
    command: ["go", "run", "github.com/openbastion/openbastion/services/vault/password-vault/cmd/password-vault"]
    environment:
      <<: *go-env
      PORT: "8081"
      DATABASE_URL: postgres://password_vault:ob-dev-password-vault@postgres:5432/password_vault?sslmode=disable
      KMS_KEY_HEX: b883e7a9a40351f519ffec706bcb39cb9fefc3f2157e66cc79d816f943512fc7
      AUTHORIZATION_URL: https://authorization:8083
      AUDIT_URL: https://audit-service:8082
      # The Vault's own demo seed needs a policy that does not exist yet: the `seed` service
      # onboards the demonstration account through the public API instead.
      SKIP_DEMO_SEED: "1"
    volumes:
      - ../..:/src
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: password-vault}}
    depends_on:
      postgres: {condition: service_healthy}
      proto: {condition: service_completed_successfully}
      pki: {condition: service_completed_successfully}
      authorization: {condition: service_healthy}
      audit-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 120s

  command-recorder:
    <<: *go
    command: ["go", "run", "github.com/openbastion/openbastion/services/recording-audit/command-recorder/cmd/command-recorder"]
    environment:
      <<: *go-env
      PORT: "8087"
      DATABASE_URL: postgres://command_recorder:ob-dev-command-recorder@postgres:5432/command_recorder?sslmode=disable
      KMS_KEY_HEX: 9b1e3a563bbd8ca0ae8c348e591df45186e6aa7a29d0fc8d9292eb18b92068a6
      AUTHORIZATION_URL: https://authorization:8083
      AUDIT_URL: https://audit-service:8082
    volumes:
      - ../..:/src
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: command-recorder}}
    depends_on:
      postgres: {condition: service_healthy}
      proto: {condition: service_completed_successfully}
      pki: {condition: service_completed_successfully}
      authorization: {condition: service_healthy}
      audit-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8087"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 120s

  seaweedfs-config:
    <<: *go
    restart: "no"
    command: ["sh", "/src/deploy/docker-compose/seaweedfs-config.sh"]
    environment:
      VIDEO_RECORDER_S3_ACCESS_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      VIDEO_RECORDER_S3_SECRET_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    volumes:
      - ../..:/src
      - seaweedfs-config:/config
    networks: []
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]

  seaweedfs:
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    restart: on-failure
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - server
      - -dir=/data
      - -volume.max=0
      - -s3
      - -s3.config=/config/s3.json
      - -s3.port=0
      - -s3.port.https=8333
      - -s3.cert.file=/pki/cert.pem
      - -s3.key.file=/pki/key.pem
      - -s3.cacert.file=/pki/ca.pem
      - -s3.tlsVerifyClientCert=true
    volumes:
      - seaweedfs-data:/data
      - {type: volume, source: seaweedfs-config, target: /config, read_only: true}
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: seaweedfs}}
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    networks: [internal]
    depends_on:
      pki: {condition: service_completed_successfully}
      seaweedfs-config: {condition: service_completed_successfully}

  video-recorder:
    <<: *go
    command: ["go", "run", "github.com/openbastion/openbastion/services/recording-audit/video-recorder/cmd/video-recorder"]
    environment:
      <<: *go-env
      PORT: "8088"
      GRPC_PORT: "8089"
      DATABASE_URL: postgres://video_recorder:ob-dev-video-recorder@postgres:5432/video_recorder?sslmode=disable
      AUTHORIZATION_URL: https://authorization:8083
      AUDIT_URL: https://audit-service:8082
      S3_ENDPOINT: https://seaweedfs:8333
      S3_BUCKET: openbastion-recordings
      S3_ACCESS_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      S3_SECRET_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      S3_CA_FILE: /pki/ca.pem
      S3_TLS_SERVICE: seaweedfs
      S3_CREATE_BUCKET: "true"
      VIDEO_RECORDER_KMS_KEY_HEX: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    volumes:
      - ../..:/src
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: video-recorder}}
    depends_on:
      postgres: {condition: service_healthy}
      proto: {condition: service_completed_successfully}
      pki: {condition: service_completed_successfully}
      authorization: {condition: service_healthy}
      audit-service: {condition: service_healthy}
      seaweedfs: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8088 && exec 4<>/dev/tcp/127.0.0.1/8089"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 120s

  # What the preview opens a screen on (ADR-0071). Not the Go services' image: the shared build
  # cache has nothing to do here, and this one has a desktop to serve.
  vnc-target:
    image: openbastion:base44-vnc-target
    build:
      context: ../..
      dockerfile: deploy/base44/Dockerfile
      target: vnc-target
    restart: on-failure
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["sh", "/deploy/vnc-target.sh"]
    environment:
      VNC_PASSWORD: demo-vnc
    volumes:
      - ./vnc-target.sh:/deploy/vnc-target.sh:ro
      - screen-target-key:/key
      - screen-target-trust:/trust
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5901"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [internal]

  # Terminates the target, records, and serves the screen to the Gateway (ADR-0071). It trusts the
  # certificate of the target above, by an explicit file, and the Vault pins it: never system roots.
  rdp-vnc-proxy:
    <<: *go
    command: ["go", "run", "github.com/openbastion/openbastion/services/proxy/rdp-vnc-proxy/cmd/rdp-vnc-proxy"]
    environment:
      <<: *go-env
      PORT: "8090"
      VAULT_URL: https://password-vault:8081
      AUDIT_URL: https://audit-service:8082
      VIDEO_RECORDER_GRPC_URL: https://video-recorder:8089
      RDP_VNC_PROXY_PUBLIC_ENDPOINT: rdp-vnc-proxy:8090
      TARGET_TLS_ROOTS_FILE: /trust/cert.pem
    volumes:
      - ../..:/src
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: rdp-vnc-proxy}}
      - {type: volume, source: screen-target-trust, target: /trust, read_only: true}
    depends_on:
      proto: {condition: service_completed_successfully}
      pki: {condition: service_completed_successfully}
      password-vault: {condition: service_healthy}
      audit-service: {condition: service_healthy}
      video-recorder: {condition: service_healthy}
      vnc-target: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 120s

  # What the preview opens an SSH session on: a pretend shell, nothing typed is executed (ADR-0033).
  # Its host key derives from this password, and seed.sh pins it: change both together.
  demo-ssh-target:
    <<: *go
    command: ["go", "run", "github.com/openbastion/openbastion/test/integration/cmd/demo-ssh-target"]
    environment:
      GOWORK: /src/go.work
      GOFLAGS: -buildvcs=false
      DEMO_TARGET_PASSWORD: demo-ssh-preview
      DEMO_TARGET_PORT: "2022"
    volumes:
      - ../..:/src
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/2022"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 120s

  ssh-proxy:
    <<: *go
    command: ["go", "run", "github.com/openbastion/openbastion/services/proxy/ssh-proxy/cmd/ssh-proxy"]
    environment:
      <<: *go-env
      PORT: "8085"
      SSH_PORT: "2222"
      VAULT_URL: https://password-vault:8081
      AUDIT_URL: https://audit-service:8082
      RECORDER_URL: https://command-recorder:8087
      RECORDING_POLICY: required
      # The address connect hands out: the port below, on the machine that runs the preview.
      SSH_PUBLIC_ENDPOINT: localhost:2222
    ports:
      - "127.0.0.1:2222:2222"
    volumes:
      - ../..:/src
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: ssh-proxy}}
    depends_on:
      proto: {condition: service_completed_successfully}
      pki: {condition: service_completed_successfully}
      password-vault: {condition: service_healthy}
      audit-service: {condition: service_healthy}
      command-recorder: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8085"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 120s

  session-broker:
    <<: *go
    command: ["go", "run", "github.com/openbastion/openbastion/services/access/session-broker/cmd/session-broker"]
    environment:
      <<: *go-env
      PORT: "8084"
      DATABASE_URL: postgres://session_broker:ob-dev-session-broker@postgres:5432/session_broker?sslmode=disable
      AUTHORIZATION_URL: https://authorization:8083
      VAULT_URL: https://password-vault:8081
      AUDIT_URL: https://audit-service:8082
      SSH_PROXY_URL: https://ssh-proxy:8085
      RDP_VNC_PROXY_URLS: https://rdp-vnc-proxy:8090
    volumes:
      - ../..:/src
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: session-broker}}
    depends_on:
      postgres: {condition: service_healthy}
      proto: {condition: service_completed_successfully}
      pki: {condition: service_completed_successfully}
      authorization: {condition: service_healthy}
      password-vault: {condition: service_healthy}
      audit-service: {condition: service_healthy}
      ssh-proxy: {condition: service_healthy}
      rdp-vnc-proxy: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8084"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 120s

  # The public API (docs/api/rest/openapi.yaml): plain HTTP for callers holding a bearer token, mutual TLS for the
  # services it calls (ADR-0010).
  api-gateway:
    <<: *go
    command: ["go", "run", "github.com/openbastion/openbastion/services/access/api-gateway/cmd/api-gateway"]
    labels:
      base44.project: API
      base44.kind: api
      base44.port: 8080
    environment:
      <<: *go-env
      PORT: "8080"
      AUTHENTICATION_URL: https://authentication:8086
      AUTHORIZATION_URL: https://authorization:8083
      SESSION_BROKER_URL: https://session-broker:8084
      VAULT_URL: https://password-vault:8081
      COMMAND_RECORDER_URL: https://command-recorder:8087
      VIDEO_RECORDER_GRPC_URL: https://video-recorder:8089
      # The preview's public host may differ from the Host the Gateway receives (ADR-0071, increment
      # 0): only that suffix is added. Unset, only the Gateway's own origin opens a screen.
      SCREEN_ALLOWED_ORIGINS: ${BASE44_PUBLIC_HOST_SUFFIX:+*.${BASE44_PUBLIC_HOST_SUFFIX}}
    volumes:
      - ../..:/src
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: api-gateway}}
    ports:
      - "8080:8080"
    depends_on:
      proto: {condition: service_completed_successfully}
      pki: {condition: service_completed_successfully}
      authentication: {condition: service_healthy}
      authorization: {condition: service_healthy}
      password-vault: {condition: service_healthy}
      session-broker: {condition: service_healthy}
      command-recorder: {condition: service_healthy}
      video-recorder: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 120s

  # The Admin UI, in development: the Vite dev server on port 3000, forwarding the public API
  # paths to the Gateway (vite.config.ts, only when BASE44_PREVIEW_MODE=1).
  web:
    image: node:22@sha256:18a6d90fd60542269850c80ca03b29b1d9b14d6b221ac7ee8e35b0d33ef904bd
    restart: on-failure
    working_dir: /app
    labels:
      base44.project: Admin UI
      base44.kind: web
      base44.port: 3000
    command: ["sh", "-ec", "cd /packages/icons && npm ci --no-audit --no-fund && npm run build && cd /app && npm ci --no-audit --no-fund && exec npx vite"]
    environment:
      - BASE44_PREVIEW_MODE=1
      - BASE44_GATEWAY_URL=http://api-gateway:8080
      # The preview reaches this server as 3000-<sandbox id>.<sandbox domain>: vite.config.ts
      # allows exactly those two host suffixes, and only when BASE44_PREVIEW_MODE=1.
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
    volumes:
      - ../../web/admin-ui:/app
      # npm resolves file:../packages/* from /app to /packages inside this container.
      - ../../web/packages:/packages:ro
      # tsup writes a temporary bundled config and dist/ while building this package.
      - ../../web/packages/icons:/packages/icons
      - node_modules:/app/node_modules
      - icons_node_modules:/packages/icons/node_modules
    ports:
      - "3000:3000"
    networks: [internal]
    depends_on:
      api-gateway: {condition: service_started}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 120s

  # The operator account (CLI), then the policies and the privileged accounts (SSH and VNC)
  # through the public API, so the preview shows a live installation rather than an empty one.
  # The script is idempotent, so this service seeds and then idles: the sandbox health check
  # reads a service that exits as a stopped one, so it marks its work done in /tmp and stays up
  # (a plain `docker compose restart seed` seeds again).
  seed:
    <<: *go
    command:
      ["sh", "-ec", "sh /src/deploy/base44/seed.sh && touch /tmp/openbastion-seeded && exec sleep infinity"]
    environment:
      <<: *go-env
      GATEWAY_URL: http://api-gateway:8080
      AUTHENTICATION_URL: https://authentication:8086
      OPERATOR_USERNAME: operator
      OPERATOR_PASSWORD: openbastion-demo
      VNC_TARGET_PASSWORD: demo-vnc
      SSH_TARGET_PASSWORD: demo-ssh-preview
    volumes:
      - ../..:/src
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: admin-cli}}
      - {type: volume, source: screen-target-trust, target: /trust, read_only: true}
    depends_on:
      proto: {condition: service_completed_successfully}
      pki: {condition: service_completed_successfully}
      authentication: {condition: service_healthy}
      api-gateway: {condition: service_healthy}
      vnc-target: {condition: service_healthy}
      demo-ssh-target: {condition: service_healthy}
    healthcheck:
      # The only state this job has: its seeding ran to completion.
      test: ["CMD", "test", "-f", "/tmp/openbastion-seeded"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 240s

volumes:
  postgres:
  pki:
  pki-ca:
  anchors:
  seaweedfs-config:
  seaweedfs-data:
  screen-target-key:
  screen-target-trust:
  node_modules:
  icons_node_modules:

networks:
  internal:
