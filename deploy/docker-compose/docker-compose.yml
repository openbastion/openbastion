# OpenBastion on one host (ADR-0033): eight services under mutual TLS, one database per service,
# two ports published on 127.0.0.1. See deploy/docker-compose/README.md.
#
#   deploy/docker-compose/init.sh                       # once: draws the secrets into .env
#   docker compose -f deploy/docker-compose/docker-compose.yml up -d --build
name: openbastion

x-service: &service
  image: openbastion:dev
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [internal]
  depends_on:
    pki:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy

x-tls: &tls
  INTERNAL_TLS: required
  TLS_CERT_FILE: /pki/cert.pem
  TLS_KEY_FILE: /pki/key.pem
  TLS_CA_FILE: /pki/ca.pem

services:
  # The certificate job: runs at every `up`, keeps the authority, renews the services'.
  pki:
    image: openbastion-tools:dev
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile
      target: tools
    entrypoint: ["/bin/sh", "/deploy/pki.sh"]
    environment:
      OB_CERT_TTL: ${OB_CERT_TTL:-720h}
    volumes:
      - pki-ca:/ca
      - pki:/pki
      - ./pki.sh:/deploy/pki.sh:ro
    network_mode: none

  postgres:
    image: openbastion-postgres:16
    build:
      context: ../..
      dockerfile: deploy/docker-compose/postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: openbastion
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:?run deploy/docker-compose/init.sh first}
      POSTGRES_DB: postgres
      PG_PASSWORD_AUTHENTICATION: ${PG_PASSWORD_AUTHENTICATION:?}
      PG_PASSWORD_AUTHORIZATION: ${PG_PASSWORD_AUTHORIZATION:?}
      PG_PASSWORD_SESSION_BROKER: ${PG_PASSWORD_SESSION_BROKER:?}
      PG_PASSWORD_PASSWORD_VAULT: ${PG_PASSWORD_PASSWORD_VAULT:?}
      PG_PASSWORD_AUDIT_SERVICE: ${PG_PASSWORD_AUDIT_SERVICE:?}
      PG_PASSWORD_COMMAND_RECORDER: ${PG_PASSWORD_COMMAND_RECORDER:?}
      PG_PASSWORD_VIDEO_RECORDER: ${PG_PASSWORD_VIDEO_RECORDER:-}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "openbastion", "-d", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [internal]

  authentication:
    <<: *service
    # Build the shared runtime image once; every other Go service reuses this exact image.
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile
      target: runtime
    entrypoint: ["/usr/local/bin/authentication"]
    environment:
      <<: *tls
      PORT: "8086"
      SKIP_DEMO_SEED: "1"
      DATABASE_URL: postgres://authentication:${PG_PASSWORD_AUTHENTICATION}@postgres:5432/authentication?sslmode=disable
      TOKEN_SIGNING_KEY_HEX: ${TOKEN_SIGNING_KEY_HEX:?}
      # Every login is written to the audit before its token is issued (ADR-0064).
      AUDIT_URL: https://audit-service:8082
    volumes:
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: authentication}}

  authorization:
    <<: *service
    entrypoint: ["/usr/local/bin/authorization"]
    environment:
      <<: *tls
      PORT: "8083"
      DATABASE_URL: postgres://authorization:${PG_PASSWORD_AUTHORIZATION}@postgres:5432/authorization?sslmode=disable
      BOOTSTRAP_ADMIN_ROLE: ${BOOTSTRAP_ADMIN_ROLE:-platform-admin}
    volumes:
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: authorization}}

  password-vault:
    <<: *service
    entrypoint: ["/usr/local/bin/password-vault"]
    environment:
      <<: *tls
      PORT: "8081"
      SKIP_DEMO_SEED: "1"
      AUTHORIZATION_URL: https://authorization:8083
      # Rotations are written to the audit before the target is touched (ADR-0037).
      AUDIT_URL: https://audit-service:8082
      DATABASE_URL: postgres://password_vault:${PG_PASSWORD_PASSWORD_VAULT}@postgres:5432/password_vault?sslmode=disable
      KMS_KEY_HEX: ${VAULT_KMS_KEY_HEX:?}
    volumes:
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: password-vault}}

  audit-service:
    <<: *service
    entrypoint: ["/usr/local/bin/audit-service"]
    environment:
      <<: *tls
      PORT: "8082"
      DATABASE_URL: postgres://audit_service:${PG_PASSWORD_AUDIT_SERVICE}@postgres:5432/audit_service?sslmode=disable
      AUDIT_CHAIN_KEY_HEX: ${AUDIT_CHAIN_KEY_HEX:?}
      AUDIT_ANCHOR_FILE: /var/lib/openbastion/anchors/anchors.jsonl
      # Retention (ADR-0032) is off unless both are set, e.g. AUDIT_RETENTION_MONTHS=12.
      AUDIT_ARCHIVE_DIR: ${AUDIT_ARCHIVE_DIR:-}
      AUDIT_RETENTION_MONTHS: ${AUDIT_RETENTION_MONTHS:-}
    volumes:
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: audit-service}}
      - anchors:/var/lib/openbastion/anchors
      - archives:/var/lib/openbastion/archives

  command-recorder:
    <<: *service
    entrypoint: ["/usr/local/bin/command-recorder"]
    environment:
      <<: *tls
      PORT: "8087"
      AUTHORIZATION_URL: https://authorization:8083
      AUDIT_URL: https://audit-service:8082
      DATABASE_URL: postgres://command_recorder:${PG_PASSWORD_COMMAND_RECORDER}@postgres:5432/command_recorder?sslmode=disable
      KMS_KEY_HEX: ${RECORDER_KMS_KEY_HEX:?}
    volumes:
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: command-recorder}}

  seaweedfs-config:
    profiles: [recording]
    image: openbastion-tools:dev
    entrypoint: ["/bin/sh", "/deploy/seaweedfs-config.sh"]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    environment:
      VIDEO_RECORDER_S3_ACCESS_KEY: ${VIDEO_RECORDER_S3_ACCESS_KEY:-}
      VIDEO_RECORDER_S3_SECRET_KEY: ${VIDEO_RECORDER_S3_SECRET_KEY:-}
    volumes:
      - seaweedfs-config:/config
      - ./seaweedfs-config.sh:/deploy/seaweedfs-config.sh:ro
    network_mode: none
    depends_on:
      pki:
        condition: service_completed_successfully

  video-recorder-db-init:
    profiles: [recording]
    image: openbastion-postgres:16
    restart: "no"
    entrypoint: ["/bin/sh", "/deploy/video-recorder-db-init.sh"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGCONNECT_TIMEOUT: "5"
      PGUSER: openbastion
      PGDATABASE: postgres
      PGPASSWORD: ${PG_SUPERUSER_PASSWORD:-}
      PG_PASSWORD_VIDEO_RECORDER: ${PG_PASSWORD_VIDEO_RECORDER:-}
    volumes:
      - ./video-recorder-db-init.sh:/deploy/video-recorder-db-init.sh:ro
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy

  seaweedfs:
    profiles: [recording]
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - server
      - -dir=/data
      - -volume.max=0
      - -s3
      - -s3.config=/config/s3.json
      - -s3.port=0
      - -s3.port.https=8333
      - -s3.cert.file=/pki/cert.pem
      - -s3.key.file=/pki/key.pem
      - -s3.cacert.file=/pki/ca.pem
      - -s3.tlsVerifyClientCert=true
    volumes:
      - seaweedfs-data:/data
      - {type: volume, source: seaweedfs-config, target: /config, read_only: true}
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: seaweedfs}}
    tmpfs: ["/tmp"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    networks: [internal]
    depends_on:
      pki:
        condition: service_completed_successfully
      seaweedfs-config:
        condition: service_completed_successfully

  video-recorder:
    profiles: [recording]
    <<: *service
    entrypoint: ["/usr/local/bin/video-recorder"]
    environment:
      <<: *tls
      PORT: "8088"
      GRPC_PORT: "8089"
      AUTHORIZATION_URL: https://authorization:8083
      AUDIT_URL: https://audit-service:8082
      DATABASE_URL: postgres://video_recorder:${PG_PASSWORD_VIDEO_RECORDER:-}@postgres:5432/video_recorder?sslmode=disable
      S3_ENDPOINT: https://seaweedfs:8333
      S3_BUCKET: openbastion-recordings
      S3_ACCESS_KEY: ${VIDEO_RECORDER_S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${VIDEO_RECORDER_S3_SECRET_KEY:-}
      S3_CA_FILE: /pki/ca.pem
      S3_TLS_SERVICE: seaweedfs
      S3_CREATE_BUCKET: "true"
      TRANSIT_ADDR: ${VIDEO_RECORDER_TRANSIT_ADDR:-}
      TRANSIT_KEY: ${VIDEO_RECORDER_TRANSIT_KEY:-}
      TRANSIT_TOKEN_FILE: /run/secrets/video-recorder-transit-token
      TRANSIT_CA_FILE: /run/secrets/video-recorder-transit-ca
    secrets:
      - video-recorder-transit-token
      - video-recorder-transit-ca
    volumes:
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: video-recorder}}
    depends_on:
      video-recorder-db-init:
        condition: service_completed_successfully
      authorization:
        condition: service_started
      audit-service:
        condition: service_started
      seaweedfs:
        condition: service_healthy

  ssh-proxy:
    <<: *service
    entrypoint: ["/usr/local/bin/ssh-proxy"]
    environment:
      <<: *tls
      PORT: "8085"
      SSH_PORT: "2222"
      VAULT_URL: https://password-vault:8081
      AUDIT_URL: https://audit-service:8082
      RECORDER_URL: https://command-recorder:8087
      RECORDING_POLICY: required
    ports:
      - "${OB_BIND:-127.0.0.1}:${OB_SSH_PORT:-2222}:2222"
    volumes:
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: ssh-proxy}}

  # Optional graphical target proxy. Enable both --profile recording and --profile rdp-vnc,
  # and set SCREEN_TARGET_CA_FILE to an explicit PEM trust bundle for VNC targets.
  rdp-vnc-proxy:
    profiles: [rdp-vnc]
    <<: *service
    entrypoint: ["/usr/local/bin/rdp-vnc-proxy"]
    environment:
      <<: *tls
      PORT: "8090"
      VAULT_URL: https://password-vault:8081
      AUDIT_URL: https://audit-service:8082
      VIDEO_RECORDER_GRPC_URL: https://video-recorder:8089
      RDP_VNC_PROXY_PUBLIC_ENDPOINT: rdp-vnc-proxy:8090
      TARGET_TLS_ROOTS_FILE: /run/secrets/screen-target-ca
      # RDP is opened by name, here and at the Broker (ADR-0088): off unless both say true.
      RDP_ENABLED: ${RDP_ENABLED:-false}
    secrets: [screen-target-ca]
    volumes:
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: rdp-vnc-proxy}}
    depends_on:
      pki: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      password-vault: {condition: service_started}
      audit-service: {condition: service_started}
      video-recorder: {condition: service_started}

  session-broker:
    <<: *service
    entrypoint: ["/usr/local/bin/session-broker"]
    environment:
      <<: *tls
      PORT: "8084"
      AUTHORIZATION_URL: https://authorization:8083
      VAULT_URL: https://password-vault:8081
      AUDIT_URL: https://audit-service:8082
      SSH_PROXY_URL: https://ssh-proxy:8085
      RDP_VNC_PROXY_URL: https://rdp-vnc-proxy:8090
      RDP_ENABLED: ${RDP_ENABLED:-false}
      DATABASE_URL: postgres://session_broker:${PG_PASSWORD_SESSION_BROKER}@postgres:5432/session_broker?sslmode=disable
    volumes:
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: session-broker}}

  api-gateway:
    <<: *service
    entrypoint: ["/usr/local/bin/api-gateway"]
    environment:
      <<: *tls
      PORT: "8080"
      AUTHENTICATION_URL: https://authentication:8086
      AUTHORIZATION_URL: https://authorization:8083
      SESSION_BROKER_URL: https://session-broker:8084
      VAULT_URL: https://password-vault:8081
      COMMAND_RECORDER_URL: https://command-recorder:8087
      VIDEO_RECORDER_GRPC_URL: https://video-recorder:8089
      # The Admin UI under /ui/, same origin as the API (ADR-0036).
      ADMIN_UI_DIR: /usr/local/share/openbastion/admin-ui
    ports:
      - "${OB_BIND:-127.0.0.1}:${OB_GATEWAY_PORT:-8080}:8080"
    volumes:
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: api-gateway}}

  # The operator's tool, under the admin-cli identity: docker compose run --rm cli …
  cli:
    <<: *service
    restart: "no"
    profiles: [cli]
    entrypoint: ["/usr/local/bin/openbastion-cli"]
    environment:
      <<: *tls
    volumes:
      - {type: volume, source: pki, target: /pki, read_only: true, volume: {subpath: admin-cli}}

  # A pretend SSH target for the demonstration (profile demo): nothing typed is executed.
  demo-ssh-target:
    <<: *service
    profiles: [demo]
    entrypoint: ["/usr/local/bin/demo-ssh-target"]
    depends_on: []
    environment:
      DEMO_TARGET_PASSWORD: ${DEMO_TARGET_PASSWORD:?}
      DEMO_TARGET_PORT: "2022"

volumes:
  postgres:
  pki:
  pki-ca:
  anchors:
  archives:
  seaweedfs-config:
  seaweedfs-data:

networks:
  internal:

secrets:
  screen-target-ca:
    file: ${SCREEN_TARGET_CA_FILE:-/dev/null}
  video-recorder-transit-token:
    file: ${VIDEO_RECORDER_TRANSIT_TOKEN_FILE:-/dev/null}
  video-recorder-transit-ca:
    file: ${VIDEO_RECORDER_TRANSIT_CA_FILE:-/dev/null}
