# The parsers a target or a browser feeds, fuzzed (ADR-0071, increment 4): every Fuzz target of the
# protocol packages for 30 s, on each pull request that touches them and once a week. A failure
# keeps the input that found it as an artifact, to become a regression test.
name: Fuzz
on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * 2"
  pull_request:
    paths:
      - pkg/rdp/**
      - pkg/vnc/**
      - pkg/screenstream/**
      - .github/workflows/fuzz.yml
permissions:
  contents: read
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true
env:
  GO_VERSION: "1.27.4"
  GOPROXY: direct
jobs:
  fuzz:
    name: fuzz ${{ matrix.package }} (30 s a target)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [./pkg/rdp, ./pkg/vnc, ./pkg/screenstream]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Every Fuzz target of ${{ matrix.package }}
        run: make fuzz FUZZ_PACKAGES=${{ matrix.package }} FUZZTIME=30s
      - name: The input that failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure-${{ strategy.job-index }}
          path: pkg/*/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14
