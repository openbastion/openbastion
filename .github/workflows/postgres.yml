# PostgreSQL-backed unit, dedicated and integration tests (ADR-0077).
name: PostgreSQL tests
on:
  workflow_call:
permissions:
  contents: read
env:
  GO_VERSION: "1.27.4"
  GOPROXY: direct
  TEST_DATABASE_URL: postgres://openbastion:openbastion@127.0.0.1:5432/openbastion?sslmode=disable
  PURGE: TRUNCATE policies, privileged_accounts, vault_secrets, vault_scope_grants, users, oidc_login_attempts, sessions, audit_events, alert_outbox, mfa_challenges, mfa_enrollment_codes, mfa_webauthn_credentials, identity_provider_bindings RESTART IDENTITY CASCADE;
jobs:
  postgres:
    name: PostgreSQL 16 — unit, dedicated, integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      # Use the same patched, digest-pinned PostgreSQL image as the Compose deployment.
      - name: Start hardened PostgreSQL 16
        run: |
          docker build -f deploy/docker-compose/postgres/Dockerfile -t openbastion-postgres:ci .
          docker run -d --name openbastion-postgres -e POSTGRES_USER=openbastion \
            -e POSTGRES_PASSWORD=openbastion -e POSTGRES_DB=openbastion \
            -p 127.0.0.1:5432:5432 --health-cmd='pg_isready -U openbastion' \
            --health-interval=2s --health-timeout=5s --health-retries=30 openbastion-postgres:ci
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' openbastion-postgres)
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && { docker logs openbastion-postgres; exit 1; }
            sleep 2
          done
          docker logs openbastion-postgres
          exit 1
      - name: psql
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - run: make proto-tools build
      # The tables exist once a service has migrated them; the unit tests of each store do.
      - name: unit tests with the database
        run: make test
      - name: dedicated PostgreSQL tests (they purge first)
        run: make test-postgres
      - name: Install TigerVNC and X11 input oracle
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            tigervnc-standalone-server tigervnc-common tigervnc-tools x11-utils openssl
      - name: Start real TigerVNC target with an independent X11 input oracle
        shell: bash
        run: |
          work="$RUNNER_TEMP/openbastion-vnc-target"
          mkdir -p "$work"
          # Keep the real target's PAM password within its practical input bound.
          # SI-02 creates a 128-character in-flight key stream and gates the TCP
          # relay after a 64-byte chunk; it does not need a 4 KiB PAM password.
          export VNC_PLAIN_PASSWORD="$(openssl rand -hex 64)"
          echo "::add-mask::$VNC_PLAIN_PASSWORD"
          test/integration/testdata/vnc/target.sh "$work" X509Plain >"$work/server.log" 2>&1 &
          echo "$!" > "$work/pid"
          ready=0
          for attempt in $(seq 1 120); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/15977' 2>/dev/null; then ready=1; break; fi
            if ! kill -0 "$(cat "$work/pid")" 2>/dev/null; then cat "$work/server.log"; exit 1; fi
            sleep 0.25
          done
          if [[ "$ready" != 1 ]]; then cat "$work/server.log"; exit 1; fi
          # GITHUB_ENV takes NAME=value lines: "export NAME=value" would name the variable
          # "export NAME", and the tests would never see the real target (found 19 Nov. 2026).
          test/integration/testdata/vnc/target.sh "$work" --env | sed 's/^export //' >> "$GITHUB_ENV"
      # TestScreenFlow_VNCInAHeadlessBrowser drives the built Admin UI, served by the Gateway, in
      # the runner's Chrome, against the real TigerVNC target above: without the build it skips.
      - uses: ./.github/actions/setup-node
        with:
          node-version: "24.21.0"
      - name: Admin UI for the VNC browser test
        run: make ui-build
      - name: integration with the database (purged first)
        # The real target is required here: without it, the real-target tests fail instead of
        # quietly running against the fake one.
        env:
          OPENBASTION_VNC_REQUIRED: "1"
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "$PURGE"
          GOWORK=$PWD/go.work go test -v ./test/integration/... -count=1 -timeout=900s
      - name: Stop real TigerVNC target
        if: always()
        shell: bash
        run: |
          work="$RUNNER_TEMP/openbastion-vnc-target"
          if [[ -f "$work/pid" ]]; then
            pid=$(cat "$work/pid")
            kill "$pid" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 0.1
            done
          fi
          sudo rm -f /etc/pam.d/openbastion-vnc
      # ADR-0071: what an operator saw of an RDP session is, to the byte, what an auditor replays,
      # sealed, across a size change; FreeRDP 3 in Docker, the real Video Recorder on this database.
      - name: RDP recording, end to end
        run: make test-rdp-recording
