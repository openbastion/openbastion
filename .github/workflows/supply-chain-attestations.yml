# Trusted-tag artifact attestations (ADR-0094). This workflow never publishes images or releases.
name: Supply chain attestations
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    name: Validate trusted release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require the project owner to create trusted tags
        env:
          ACTOR: ${{ github.actor }}
        run: test "$ACTOR" = "eldorplus"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version: "1.27.3"
      - name: Validate SemVer tag and VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: make version-check TAG="$TAG"
      - name: Require tag commit to be reachable from main
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          TAG_COMMIT="$(git rev-parse "$GITHUB_REF^{commit}")"
          test "$TAG_COMMIT" = "$SOURCE_SHA" || {
            echo "tag ref resolves to $TAG_COMMIT, not event SHA $SOURCE_SHA" >&2
            exit 1
          }
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "tag commit $SOURCE_SHA is not reachable from origin/main" >&2
            exit 1
          }
  build:
    name: Build and scan runtime image archive
    needs: version
    uses: ./.github/workflows/containers.yml
    with:
      attest: true
    permissions:
      contents: read
  attest:
    name: Attest trusted runtime image archive
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download runtime image and SBOM from the build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openbastion-supply-chain-${{ github.sha }}
          path: ${{ runner.temp }}/supply-chain
      - name: Require attestation subjects
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/supply-chain/openbastion-runtime-image.tar.gz
          RUNTIME_SBOM: ${{ runner.temp }}/supply-chain/openbastion-runtime-sbom.cdx.json
        run: |
          test -s "$IMAGE_ARCHIVE"
          test -s "$RUNTIME_SBOM"
          sha256sum "$IMAGE_ARCHIVE"
      - name: Generate SLSA build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/supply-chain/openbastion-runtime-image.tar.gz
      - name: Generate CycloneDX SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/supply-chain/openbastion-runtime-image.tar.gz
          sbom-path: ${{ runner.temp }}/supply-chain/openbastion-runtime-sbom.cdx.json
