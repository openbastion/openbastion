# The deployable Docker Compose stack, exercised end to end (ADR-0033, ADR-0116).
# Kept separate from process-level integration tests: this builds and starts every real container.
name: Docker Compose tests
on:
  workflow_call:
permissions:
  contents: read
env:
  GO_VERSION: "1.27.4"
  GOPROXY: direct
jobs:
  compose:
    name: Compose — full MVP journey
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify Docker Engine and Compose
        run: |
          docker version
          docker compose version
      # Protobuf contracts are generated, not committed. test-compose depends on proto-gen.
      - name: Install pinned Protobuf tools
        run: make proto-tools
      - name: Build and exercise the real Compose stack
        run: make test-compose
      - name: Collect Compose diagnostics on failure
        if: failure()
        run: |
          docker ps -a
          for container in $(docker ps -aq --filter label=com.docker.compose.project=obcompose-test); do
            docker logs "$container" 2>&1 || true
          done
