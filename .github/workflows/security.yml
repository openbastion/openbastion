# Dependency vulnerability checks (ADR-0052, ADR-0077).
name: Security checks
on:
  workflow_call:
permissions:
  contents: read
env:
  GO_VERSION: "1.27.4"
  NODE_VERSION: "24.21.0"
  GOPROXY: direct
jobs:
  vulnerabilities:
    name: govulncheck and npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Every go.work module, symbol by symbol, and both frontend lockfiles (ADR-0052).
      - run: make proto-tools vuln
