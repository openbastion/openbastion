# The RDP proxy against a real Windows (ADR-0071): Windows Server 2022, and 2019, in a KVM virtual machine
# (dockur/windows), installed unattended at each run. Not a required check: an installation takes
# tens of minutes. It runs when the target, its test or the RDP stack change, every Monday, and on
# demand.
name: Windows RDP
on:
  workflow_dispatch:
    inputs:
      isolation:
        description: "go test -run pattern of the pkg/rdp Windows isolation (default: the connection sequence)"
        required: false
        default: ""
  schedule:
    - cron: "23 3 * * 1"
  pull_request:
    paths:
      - test/integration/testdata/rdp/windows/**
      - services/proxy/rdp-vnc-proxy/internal/engine/rdp_windows_interop_test.go
      - services/proxy/rdp-vnc-proxy/internal/engine/rdp.go
      - pkg/rdp/**
      - services/proxy/rdp-vnc-proxy/internal/interfaces/rdp_recording_test.go
      - .github/workflows/windows-rdp.yml
permissions:
  contents: read
concurrency:
  group: windows-rdp-${{ github.ref }}
  cancel-in-progress: true
env:
  GO_VERSION: "1.27.4"
  # The Admin UI, built for the headless browser step (ADR-0095): the version frontend.yml uses.
  NODE_VERSION: "24.21.0"
  GOPROXY: direct
jobs:
  windows:
    # 16: Windows as installed, the real case (ADR-0086). 32: 32 bpp allowed by policy, the 32-bpp
    # path (RDP 6.0 planar) against Windows. Each on its own runner, side by side.
    name: RDP against Windows Server ${{ matrix.version }} (${{ matrix.depth }} bpp, session ${{ matrix.session }}${{ matrix.keyboard != 'en-US' && format(', {0}', matrix.keyboard) || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        depth: [16, 32]
        session: [none]
        # A dimension, not a key added by include: an include that matches a combination and only
        # adds a key merges into it instead of making a job of its own.
        keyboard: [en-US]
        version: ["2022"]
        # The session dockur opens at the console for the user, kept: taking it over by RDP.
        include:
          - depth: 16
            session: console
            keyboard: en-US
            version: "2022"
          # AZERTY (ADR-0088): the operator's physical keys, read by the target's own layout.
          - depth: 16
            session: none
            keyboard: fr-FR
            version: "2022"
          # Windows Server 2019 (ADR-0071, increment 4: the matrix of real targets), as installed.
          - depth: 16
            session: none
            keyboard: en-US
            version: "2019"
    env:
      DEPTH: ${{ matrix.depth }}
      SESSION: ${{ matrix.session }}
      KEYBOARD: ${{ matrix.keyboard || 'en-US' }}
      WINDOWS_VERSION: ${{ matrix.version || '2022' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: KVM
        run: |
          if [ ! -e /dev/kvm ]; then echo "::error::this runner has no /dev/kvm: dockur/windows cannot run here"; exit 1; fi
          ls -l /dev/kvm
      - name: Disk for a 6 GB ISO and a 40 GB disk
        # The toolchains the runner image carries and this job does not use.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / "$RUNNER_TEMP"
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      # The same client against FreeRDP 3 first (ADR-0071): a change made for Windows must not break
      # what works already. It runs nowhere else in CI.
      - name: RDP against FreeRDP
        run: make test-rdp-interop
      - name: "Prepare the target (authority, certificate, password: for this run only)"
        if: ${{ !cancelled() }}
        run: bash test/integration/testdata/rdp/windows/prepare.sh "$RUNNER_TEMP/windows" "$DEPTH" "$SESSION" "$KEYBOARD" "$WINDOWS_VERSION"
      - name: Start Windows
        if: ${{ !cancelled() }}
        run: docker compose --env-file "$RUNNER_TEMP/windows/compose.env" -f test/integration/testdata/rdp/windows/docker-compose.yml up -d
      - name: RDP against Windows
        if: ${{ !cancelled() }}
        run: |
          set -a; . "$RUNNER_TEMP/windows/test.env"; set +a
          make test-rdp-windows
      # ADR-0071: the recording against Windows. The proxy's real server with the RDP codec, the real
      # Video Recorder on PostgreSQL: what the operator saw is, to the byte, what an auditor replays.
      - name: PostgreSQL for the Video Recorder
        if: ${{ !cancelled() }}
        run: |
          docker build -f deploy/docker-compose/postgres/Dockerfile -t openbastion-postgres:ci .
          docker run -d --name openbastion-postgres -e POSTGRES_USER=openbastion -e POSTGRES_PASSWORD=openbastion \
            -e POSTGRES_DB=openbastion -p 127.0.0.1:5432:5432 \
            --health-cmd="pg_isready -U openbastion" --health-interval=2s --health-timeout=5s --health-retries=30 openbastion-postgres:ci
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' openbastion-postgres)
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && break
            sleep 2
          done
          docker logs openbastion-postgres
          exit 1
      - name: RDP recording against Windows
        if: ${{ !cancelled() }}
        env:
          TEST_DATABASE_URL: postgres://openbastion:openbastion@127.0.0.1:5432/openbastion?sslmode=disable
        run: |
          # The Protobuf contracts are not in git (*.pb.go): the recorder's client needs them.
          make proto-tools proto-gen
          set -a; . "$RUNNER_TEMP/windows/test.env"; set +a
          go test ./services/proxy/rdp-vnc-proxy/internal/interfaces/ -run TestRDPRecording -v -count=1 -timeout=15m
      # ADR-0095, increment 5: the resize in a real browser. The eight services on real processes,
      # SCREEN_RESIZE on, the Admin UI served by the Gateway, and the runner's own Chrome, headless,
      # driven by the DevTools Protocol: it logs in, opens the screen, and is resized twice; the
      # remote desktop must follow. Its screenshots join the dump (browser-resize-*.png).
      - uses: ./.github/actions/setup-node
        if: ${{ !cancelled() }}
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The resize in a headless browser
        if: ${{ !cancelled() }}
        env:
          TEST_DATABASE_URL: postgres://openbastion:openbastion@127.0.0.1:5432/openbastion?sslmode=disable
        run: |
          make ui-build
          set -a; . "$RUNNER_TEMP/windows/test.env"; set +a
          go test ./test/integration/ -run TestScreenFlow_RDPResizeInAHeadlessBrowser -v -count=1 -timeout=20m
      # Runs #16 to #32 settled CredSSP, TLS, the Connect-Initial and the Confirm Active (ADR-0071):
      # only the connection sequence runs by default, before the reference clients (run #34: after
      # them, Windows answered no X.224 request); every TestRDPWindowsIsolation test stays in
      # pkg/rdp, for a dispatch with this pattern widened.
      - name: Isolate what Windows refuses after CredSSP
        if: ${{ !cancelled() }}
        env:
          RDP_WINDOWS_ISOLATION: ${{ inputs.isolation || 'TestRDPWindowsIsolation_(ConnectionSequence|Reconnect|Reactivation)$' }}
        run: |
          set -a; . "$RUNNER_TEMP/windows/test.env"; set +a
          RDP_WINDOWS_FREERDP_RECORD="$RUNNER_TEMP/windows/freerdp/freerdp.dump" \
            go test ./pkg/rdp -run "$RDP_WINDOWS_ISOLATION" -v -count=1 -timeout=30m
      # A reference client on the same machine (ADR-0071): run #21 had FreeRDP open a full session.
      # Its log is in the artifact; its PDUs, recorded in clear for the isolation that follows (it
      # sends FreeRDP's own Connect-Initial after this client's CredSSP), hold the password and
      # stay outside the artifact.
      - name: FreeRDP against Windows
        if: ${{ !cancelled() }}
        run: |
          set -a; . "$RUNNER_TEMP/windows/test.env"; set +a
          docker build -q -t openbastion-rdp-reference-client test/integration/testdata/rdp/windows/client
          mkdir -p "$RUNNER_TEMP/windows/freerdp"
          docker run --rm --network host --add-host "$RDP_WINDOWS_SERVER_NAME:127.0.0.1" \
            -v "$RDP_WINDOWS_CA_FILE:/usr/local/share/ca-certificates/rdp-test.crt:ro" \
            -v "$RUNNER_TEMP/windows/freerdp:/out" -e RDP_RECORD=/out/freerdp.dump \
            -e RDP_HOST="$RDP_WINDOWS_SERVER_NAME:3389" -e RDP_USER="$RDP_WINDOWS_USER" -e RDP_PASSWORD="$RDP_WINDOWS_PASSWORD" \
            openbastion-rdp-reference-client > "$RDP_WINDOWS_DUMP/freerdp-client.log" 2>&1 || true
          sudo chmod -R a+rX "$RUNNER_TEMP/windows/freerdp"
          grep -v -i "password" "$RDP_WINDOWS_DUMP/freerdp-client.log" | grep -E -i "error|fail|connect|mcs|gcc|nego|nla|credssp|exit status" | head -80
      # A second reference client, in Go like this one (ADR-0071): gopher-rdp, at a pinned commit,
      # read before being pinned. If it gets a session, Go's TLS stack is not the cause.
      - name: gopher-rdp against Windows
        if: ${{ !cancelled() }}
        run: |
          set -a; . "$RUNNER_TEMP/windows/test.env"; set +a
          bash test/integration/testdata/rdp/windows/gopher-rdp.sh "$RUNNER_TEMP/windows/gopher-rdp" "$RDP_WINDOWS_DUMP"
      # ADR-0071: what Windows refuses after CredSSP — one case per fresh connection: blocks and
      # parameters of the Connect-Initial (MS-RDPBCGR §4.1.3), then authInfo (a refused one as the
      # counter-proof, the TSPasswordCreds domain, TLS 1.2). The tables are in the artifact.
      # rdp-setup.ps1 copies the RDP event logs every 30 s: wait for the copy that follows the last
      # connection, then keep them with the rest. Absent if the share did not work.
      - name: What Windows logged
        if: ${{ !cancelled() }}
        run: |
          sleep 45
          mkdir -p "$RUNNER_TEMP/windows/dump/events"
          sudo cp -r "$RUNNER_TEMP/windows/shared/." "$RUNNER_TEMP/windows/dump/events/" || true
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/windows/dump/events"
          ls -l "$RUNNER_TEMP/windows/dump/events"
          for f in "$RUNNER_TEMP"/windows/dump/events/*RdpCoreTS_Operational.txt "$RUNNER_TEMP"/windows/dump/events/System-rdp.txt; do
            if [ -f "$f" ]; then echo "== $f"; head -c 6000 "$f"; fi
          done
      - name: What Windows showed
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-rdp-screens-${{ matrix.version }}-${{ matrix.depth }}bpp-${{ matrix.session }}-${{ matrix.keyboard || 'en-US' }}
          path: ${{ runner.temp }}/windows/dump/
          if-no-files-found: ignore
          retention-days: 14
      - name: The virtual machine's log
        if: failure()
        run: docker logs --tail 200 openbastion-rdp-windows || true
      - name: Stop Windows
        if: always()
        run: docker compose --env-file "$RUNNER_TEMP/windows/compose.env" -f test/integration/testdata/rdp/windows/docker-compose.yml down -v || true
