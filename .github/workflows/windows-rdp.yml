# The RDP proxy against a real Windows (ADR-0071): Windows Server 2022 in a KVM virtual machine
# (dockur/windows), installed unattended at each run. Not a required check: an installation takes
# tens of minutes. It runs when the target, its test or the RDP stack change, every Monday, and on
# demand.
name: Windows RDP
on:
  workflow_dispatch:
    inputs:
      isolation:
        description: "go test -run pattern of the pkg/rdp Windows isolation (default: the connection sequence)"
        required: false
        default: ""
  schedule:
    - cron: "23 3 * * 1"
  pull_request:
    paths:
      - test/integration/testdata/rdp/windows/**
      - services/proxy/rdp-vnc-proxy/internal/engine/rdp_windows_interop_test.go
      - services/proxy/rdp-vnc-proxy/internal/engine/rdp.go
      - pkg/rdp/**
      - .github/workflows/windows-rdp.yml
permissions:
  contents: read
concurrency:
  group: windows-rdp-${{ github.ref }}
  cancel-in-progress: true
env:
  GO_VERSION: "1.27.3"
  GOPROXY: direct
jobs:
  windows:
    name: RDP against Windows Server 2022
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: KVM
        run: |
          if [ ! -e /dev/kvm ]; then echo "::error::this runner has no /dev/kvm: dockur/windows cannot run here"; exit 1; fi
          ls -l /dev/kvm
      - name: Disk for a 6 GB ISO and a 40 GB disk
        # The toolchains the runner image carries and this job does not use.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / "$RUNNER_TEMP"
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      # The same client against FreeRDP 3 first (ADR-0071): a change made for Windows must not break
      # what works already. It runs nowhere else in CI.
      - name: RDP against FreeRDP
        run: make test-rdp-interop
      - name: "Prepare the target (authority, certificate, password: for this run only)"
        if: ${{ !cancelled() }}
        run: bash test/integration/testdata/rdp/windows/prepare.sh "$RUNNER_TEMP/windows"
      - name: Start Windows
        if: ${{ !cancelled() }}
        run: docker compose --env-file "$RUNNER_TEMP/windows/compose.env" -f test/integration/testdata/rdp/windows/docker-compose.yml up -d
      - name: RDP against Windows
        if: ${{ !cancelled() }}
        run: |
          set -a; . "$RUNNER_TEMP/windows/test.env"; set +a
          make test-rdp-windows
      # Runs #16 to #32 settled CredSSP, TLS, the Connect-Initial and the Confirm Active (ADR-0071):
      # only the connection sequence runs by default, before the reference clients (run #34: after
      # them, Windows answered no X.224 request); every TestRDPWindowsIsolation test stays in
      # pkg/rdp, for a dispatch with this pattern widened.
      - name: Isolate what Windows refuses after CredSSP
        if: ${{ !cancelled() }}
        env:
          RDP_WINDOWS_ISOLATION: ${{ inputs.isolation || 'TestRDPWindowsIsolation_(ConnectionSequence|Keyboard)$' }}
        run: |
          set -a; . "$RUNNER_TEMP/windows/test.env"; set +a
          RDP_WINDOWS_FREERDP_RECORD="$RUNNER_TEMP/windows/freerdp/freerdp.dump" \
            go test ./pkg/rdp -run "$RDP_WINDOWS_ISOLATION" -v -count=1 -timeout=20m
      # A reference client on the same machine (ADR-0071): run #21 had FreeRDP open a full session.
      # Its log is in the artifact; its PDUs, recorded in clear for the isolation that follows (it
      # sends FreeRDP's own Connect-Initial after this client's CredSSP), hold the password and
      # stay outside the artifact.
      - name: FreeRDP against Windows
        if: ${{ !cancelled() }}
        run: |
          set -a; . "$RUNNER_TEMP/windows/test.env"; set +a
          docker build -q -t openbastion-rdp-reference-client test/integration/testdata/rdp/windows/client
          mkdir -p "$RUNNER_TEMP/windows/freerdp"
          docker run --rm --network host --add-host "$RDP_WINDOWS_SERVER_NAME:127.0.0.1" \
            -v "$RDP_WINDOWS_CA_FILE:/usr/local/share/ca-certificates/rdp-test.crt:ro" \
            -v "$RUNNER_TEMP/windows/freerdp:/out" -e RDP_RECORD=/out/freerdp.dump \
            -e RDP_HOST="$RDP_WINDOWS_SERVER_NAME:3389" -e RDP_USER="$RDP_WINDOWS_USER" -e RDP_PASSWORD="$RDP_WINDOWS_PASSWORD" \
            openbastion-rdp-reference-client > "$RDP_WINDOWS_DUMP/freerdp-client.log" 2>&1 || true
          sudo chmod -R a+rX "$RUNNER_TEMP/windows/freerdp"
          grep -v -i "password" "$RDP_WINDOWS_DUMP/freerdp-client.log" | grep -E -i "error|fail|connect|mcs|gcc|nego|nla|credssp|exit status" | head -80
      # A second reference client, in Go like this one (ADR-0071): gopher-rdp, at a pinned commit,
      # read before being pinned. If it gets a session, Go's TLS stack is not the cause.
      - name: gopher-rdp against Windows
        if: ${{ !cancelled() }}
        run: |
          set -a; . "$RUNNER_TEMP/windows/test.env"; set +a
          bash test/integration/testdata/rdp/windows/gopher-rdp.sh "$RUNNER_TEMP/windows/gopher-rdp" "$RDP_WINDOWS_DUMP"
      # ADR-0071: what Windows refuses after CredSSP — one case per fresh connection: blocks and
      # parameters of the Connect-Initial (MS-RDPBCGR §4.1.3), then authInfo (a refused one as the
      # counter-proof, the TSPasswordCreds domain, TLS 1.2). The tables are in the artifact.
      # rdp-setup.ps1 copies the RDP event logs every 30 s: wait for the copy that follows the last
      # connection, then keep them with the rest. Absent if the share did not work.
      - name: What Windows logged
        if: ${{ !cancelled() }}
        run: |
          sleep 45
          mkdir -p "$RUNNER_TEMP/windows/dump/events"
          sudo cp -r "$RUNNER_TEMP/windows/shared/." "$RUNNER_TEMP/windows/dump/events/" || true
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/windows/dump/events"
          ls -l "$RUNNER_TEMP/windows/dump/events"
          for f in "$RUNNER_TEMP"/windows/dump/events/*RdpCoreTS_Operational.txt "$RUNNER_TEMP"/windows/dump/events/System-rdp.txt; do
            if [ -f "$f" ]; then echo "== $f"; head -c 6000 "$f"; fi
          done
      - name: What Windows showed
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-rdp-screens
          path: ${{ runner.temp }}/windows/dump/
          if-no-files-found: ignore
          retention-days: 14
      - name: The virtual machine's log
        if: failure()
        run: docker logs --tail 200 openbastion-rdp-windows || true
      - name: Stop Windows
        if: always()
        run: docker compose --env-file "$RUNNER_TEMP/windows/compose.env" -f test/integration/testdata/rdp/windows/docker-compose.yml down -v || true
