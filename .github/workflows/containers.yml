# Container image construction and vulnerability scanning (ADR-0060, ADR-0077).
name: Container image checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  images:
    name: Images — Trivy (HIGH, CRITICAL)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Do not use trivy-action or setup-trivy: download the release archive and verify its digest.
      TRIVY_VERSION: 0.76.1
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy, checked against its digest
        run: |
          curl -fsSL -o "$RUNNER_TEMP/trivy.tgz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy
      - name: Validate project licence metadata and notices
        run: make license-check
      - name: Generate source SBOM (CycloneDX)
        run: |
          "$RUNNER_TEMP/trivy" fs --include-dev-deps --format cyclonedx \
            --output "$RUNNER_TEMP/openbastion-source-sbom.cdx.json" .
      - name: Inventory source and dependency licences
        run: |
          "$RUNNER_TEMP/trivy" fs --include-dev-deps --scanners license --license-full \
            --format json --output "$RUNNER_TEMP/openbastion-license-report.json" .
      - name: Enforce restricted and forbidden licence policy
        run: |
          "$RUNNER_TEMP/trivy" fs --include-dev-deps --scanners license \
            --severity HIGH,CRITICAL --exit-code 1 .
      # HIGH/CRITICAL vulnerabilities with a fix fail unless explicitly accepted by path and expiry.
      # Release tags use VERSION; other refs use VERSION plus the commit, as before.
      - run: make scan-images TRIVY="$RUNNER_TEMP/trivy" ${{ github.ref_type == 'tag' && 'BUILD_VERSION=$(cat VERSION)' || '' }}
      - name: Generate runtime image SBOM (CycloneDX)
        run: |
          "$RUNNER_TEMP/trivy" image --format cyclonedx \
            --output "$RUNNER_TEMP/openbastion-runtime-sbom.cdx.json" openbastion:scan
      - name: Upload SBOM and licence inventory
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: openbastion-supply-chain-${{ github.sha }}
          path: |
            ${{ runner.temp }}/openbastion-source-sbom.cdx.json
            ${{ runner.temp }}/openbastion-runtime-sbom.cdx.json
            ${{ runner.temp }}/openbastion-license-report.json
          if-no-files-found: ignore
          retention-days: 30
