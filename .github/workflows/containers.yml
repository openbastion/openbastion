# Container image construction, scanning and optional trusted-tag attestations (ADR-0093).
name: Container image checks
on:
  workflow_call:
    inputs:
      attest:
        description: "Generate trusted-tag attestations for the exported runtime image archive"
        required: false
        type: boolean
        default: false
jobs:
  images:
    name: Images — Trivy (HIGH, CRITICAL)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      # Do not use trivy-action or setup-trivy: download the release archive and verify its digest.
      TRIVY_VERSION: 0.76.1
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy, checked against its digest
        run: |
          curl -fsSL -o "$RUNNER_TEMP/trivy.tgz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy
      - name: Validate project licence metadata and notices
        run: make license-check
      - name: Test CycloneDX contract validator
        run: bash scripts/test-check-cyclonedx-sbom.sh
      - name: Generate source SBOM (CycloneDX)
        run: |
          "$RUNNER_TEMP/trivy" fs --include-dev-deps --format cyclonedx \
            --output "$RUNNER_TEMP/openbastion-source-sbom.cdx.json" .
      - name: Inventory source and dependency licences
        run: |
          "$RUNNER_TEMP/trivy" fs --include-dev-deps --scanners license --license-full \
            --format json --output "$RUNNER_TEMP/openbastion-license-report.json" .
      - name: Enforce restricted and forbidden third-party licence policy
        run: |
          # AGPL-3.0-only is the project's declared licence and is compatible
          # with the repository's AGPL policy. Keep it in the full inventory,
          # but do not classify it as a forbidden third-party dependency.
          "$RUNNER_TEMP/trivy" fs --include-dev-deps --scanners license \
            --ignored-licenses AGPL-3.0-only \
            --severity HIGH,CRITICAL --exit-code 1 .
      # HIGH/CRITICAL vulnerabilities with a fix fail unless explicitly accepted by path and expiry.
      # Release tags use VERSION; other refs use VERSION plus the commit, as before.
      - run: make scan-images TRIVY="$RUNNER_TEMP/trivy" ${{ github.ref_type == 'tag' && 'BUILD_VERSION=$(cat VERSION)' || '' }}
      - name: Generate runtime image SBOM (CycloneDX)
        run: |
          "$RUNNER_TEMP/trivy" image --format cyclonedx \
            --output "$RUNNER_TEMP/openbastion-runtime-sbom.cdx.json" openbastion:scan
      - name: Validate source and runtime CycloneDX contracts
        run: |
          bash scripts/check-cyclonedx-sbom.sh "$RUNNER_TEMP/openbastion-source-sbom.cdx.json"
          bash scripts/check-cyclonedx-sbom.sh "$RUNNER_TEMP/openbastion-runtime-sbom.cdx.json"
      - name: Guard trusted-tag attestation context
        if: ${{ inputs.attest }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          test "$EVENT_NAME" = push
          test "$REPOSITORY" = openbastion/openbastion
          test "$REPOSITORY_ID" = 1405264581
          test "$REPOSITORY_OWNER_ID" = 322037689
          [[ "$REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$WORKFLOW_REF" == "openbastion/openbastion/.github/workflows/supply-chain-attestations.yml@$REF" ]]
      - name: Export runtime image as an attestation subject
        if: ${{ inputs.attest }}
        run: |
          docker save openbastion:scan | gzip -n > "$RUNNER_TEMP/openbastion-runtime-image.tar.gz"
          test -s "$RUNNER_TEMP/openbastion-runtime-image.tar.gz"
          sha256sum "$RUNNER_TEMP/openbastion-runtime-image.tar.gz"
      - name: Generate SLSA build provenance attestation
        if: ${{ inputs.attest }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/openbastion-runtime-image.tar.gz
      - name: Generate CycloneDX SBOM attestation
        if: ${{ inputs.attest }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/openbastion-runtime-image.tar.gz
          sbom-path: ${{ runner.temp }}/openbastion-runtime-sbom.cdx.json
      - name: Upload SBOM and licence inventory
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: openbastion-supply-chain-${{ github.sha }}
          path: |
            ${{ runner.temp }}/openbastion-source-sbom.cdx.json
            ${{ runner.temp }}/openbastion-runtime-sbom.cdx.json
            ${{ runner.temp }}/openbastion-license-report.json
            ${{ runner.temp }}/openbastion-runtime-image.tar.gz
          if-no-files-found: ignore
          retention-days: 30
