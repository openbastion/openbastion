# Real-process integration tests without a database (ADR-0047, ADR-0077).
name: Integration tests
on:
  workflow_call:
permissions:
  contents: read
env:
  GO_VERSION: "1.27.4"
  GOPROXY: direct
jobs:
  integration:
    name: integration on real processes, without a database
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      # Integration tests build services with GOPROXY=off; the module cache is populated first.
      - run: make proto-tools proto-lint build
      - run: GOWORK=$PWD/go.work go test -v ./test/integration/... -count=1 -timeout=900s
