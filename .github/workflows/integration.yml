# Real-process integration tests without a database (ADR-0047, ADR-0077).
name: Integration tests
on:
  workflow_call:
permissions:
  contents: read
env:
  GO_VERSION: "1.27.4"
  GOPROXY: direct
jobs:
  integration:
    name: integration on real processes, without a database
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: ./.github/actions/setup-node
        with:
          node-version: "24.21.0"
      # Integration tests build services with GOPROXY=off; the module cache is populated first.
      - run: make proto-tools proto-lint build
      # A real Chromium exercises the React/Vite Admin UI. The API is stubbed at the browser
      # boundary; the real-process integration suite below separately proves service behavior.
      - name: Prepare Admin UI browser test
        run: |
          make ui-icons
          npm --prefix web/admin-ui ci --no-audit --no-fund
      - name: Admin UI secret injection and screen end in headless Chrome
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome" ]]; then echo "A Chromium/Chrome binary is required for the Admin UI browser test" >&2; exit 1; fi
          GOWORK=$PWD/go.work CHROME="$chrome" go test ./test/integration -run '^TestAdminUI_(SecretInjectionStepUp|ScreenEndIsSeen)InAHeadlessBrowser$' -count=1 -v -timeout=180s
      - run: GOWORK=$PWD/go.work go test -v ./test/integration/... -count=1 -timeout=900s
