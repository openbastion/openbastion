# Event entry point and stable branch-protection contract (ADR-0077).
name: CI
on:
  push:
    branches: [main]
    # A tag vX.Y.Z is a release (ADR-0063); the version workflow validates it against VERSION.
    tags: ["v*"]
  pull_request:
  # Weekly, so vulnerabilities published without a repository change are still detected (ADR-0052).
  schedule:
    - cron: "17 5 * * 1"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    name: Go
    uses: ./.github/workflows/go.yml
    permissions:
      contents: read
  integration:
    name: Integration
    uses: ./.github/workflows/integration.yml
    permissions:
      contents: read
  postgres:
    name: PostgreSQL
    uses: ./.github/workflows/postgres.yml
    permissions:
      contents: read
  frontend:
    name: Frontend
    uses: ./.github/workflows/frontend.yml
    permissions:
      contents: read
  security:
    name: Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
  containers:
    name: Containers
    uses: ./.github/workflows/containers.yml
    permissions:
      contents: read
  required-checks:
    name: Required checks
    needs: [go, integration, postgres, frontend, security, containers]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test fail-closed gate behavior
        run: bash .github/scripts/test-required-checks.sh
      - name: Require every workflow to succeed
        env:
          GO_RESULT: ${{ needs.go.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
        run: bash .github/scripts/required-checks.sh
