<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="682" viewBox="0 0 1440 682" role="img" aria-labelledby="title desc">
  <title id="title">OpenBastion — Données &amp; retours système</title>
  <desc id="desc">Visualisation des données, états, alertes et notifications. Planche de composants illustratifs alignés sur les références UI du projet.</desc>

  <defs>
    <style>
      svg {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .brand-kicker { fill: #2563EB; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
      .page-title { fill: #0F172A; font-size: 34px; font-weight: 700; }
      .page-subtitle { fill: #64748B; font-size: 15px; font-weight: 400; }
      .section-label { fill: #2563EB; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
      .card-bg { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
      .card-title { fill: #0F172A; font-size: 12px; font-weight: 700; }
      .card-tag { fill: #94A3B8; font-size: 8px; font-weight: 700; text-anchor: end; }
      .card-divider { stroke: #F1F5F9; stroke-width: 1; }
      .footer-text { fill: #64748B; font-size: 9px; font-weight: 500; }
    </style>

    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>

    <!-- Gabarit de carte standard (420 x 112) -->
    <g id="card-shell">
      <rect width="420" height="112" rx="8" class="card-bg" filter="url(#cardShadow)" />
      <line x1="16" y1="31" x2="404" y2="31" class="card-divider" />
      <text x="404" y="22" class="card-tag">UI COMPONENT</text>
    </g>
  </defs>

  <!-- Arrière-plan et bandeau supérieur -->
  <g id="Layer_Background">
    <rect width="1440" height="682" fill="#F8FAFC" />
  </g>
  <g id="Layer_BrandChrome">
    <rect width="1440" height="10" fill="#0D2137" />
  </g>

  <!-- En-tête de planche -->
  <g id="Layer_Header">
    <text x="64" y="62" class="brand-kicker">OPENBASTION / DESIGN SYSTEM</text>
    <text x="64" y="116" class="page-title">Données &amp; retours système</text>
    <text x="64" y="148" class="page-subtitle">Données, indicateurs et retours système · composants illustratifs alignés sur les références</text>
  </g>

  <!-- Contenu principal : Grille 3 colonnes (x = 64, 510, 956 | largeur carte = 420 | gouttière = 26) -->
  <g id="Layer_Content">
    <!-- Séparateur de section -->
    <g id="Section_Header">
      <text x="64" y="207" class="section-label">DONNÉES &amp; RETOURS SYSTÈME</text>
      <line x1="250" y1="203" x2="1376" y2="203" stroke="#E2E8F0" stroke-width="1" />
    </g>

    <!-- RANGÉE 1 (y = 221) -->
    <g id="Row_1">
      <!-- Carte 1 : Alert -->
      <g id="Card_Alert" transform="translate(64, 221)">
        <use href="#card-shell" />
        <text x="16" y="23" class="card-title">Alert</text>

        <rect x="16" y="42" width="388" height="54" rx="7" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
        <circle cx="32" cy="59" r="6" fill="#2563EB" />
        <text x="46" y="62" font-size="10" fill="#1E3A8A" font-weight="700">Information</text>
        <text x="46" y="80" font-size="9.5" fill="#1E3A8A" font-weight="500">La session est prête à être ouverte.</text>
      </g>

      <!-- Carte 2 : Badge -->
      <g id="Card_Badge" transform="translate(510, 221)">
        <use href="#card-shell" />
        <text x="16" y="23" class="card-title">Badge</text>

        <rect x="16" y="52" width="50" height="20" rx="4" fill="#ECFDF5" />
        <text x="41" y="65" font-size="9.5" fill="#047857" font-weight="600" text-anchor="middle">Actif</text>

        <rect x="74" y="52" width="76" height="20" rx="4" fill="#FFFBEB" />
        <text x="112" y="65" font-size="9.5" fill="#B45309" font-weight="600" text-anchor="middle">En attente</text>

        <rect x="158" y="52" width="54" height="20" rx="4" fill="#FEE2E2" />
        <text x="185" y="65" font-size="9.5" fill="#B91C1C" font-weight="600" text-anchor="middle">Bloqué</text>

        <rect x="220" y="52" width="46" height="20" rx="4" fill="#DBEAFE" />
        <text x="243" y="65" font-size="9.5" fill="#1D4ED8" font-weight="600" text-anchor="middle">Info</text>
      </g>

      <!-- Carte 3 : Carousel -->
      <g id="Card_Carousel" transform="translate(956, 221)">
        <use href="#card-shell" />
        <text x="16" y="23" class="card-title">Carousel</text>

        <!-- Élément carousel 1 -->
        <rect x="16" y="42" width="112" height="54" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <rect x="24" y="50" width="96" height="22" rx="4" fill="#DBEAFE" />
        <text x="72" y="65" font-size="9" fill="#334155" font-weight="600" text-anchor="middle">Session SSH</text>
        <text x="72" y="87" font-size="9" fill="#64748B" font-weight="500" text-anchor="middle">‹   • • •   ›</text>

        <!-- Élément carousel 2 -->
        <rect x="138" y="42" width="112" height="54" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <rect x="146" y="50" width="96" height="22" rx="4" fill="#EFF6FF" />
        <text x="194" y="65" font-size="9" fill="#334155" font-weight="600" text-anchor="middle">Session RDP</text>
        <text x="194" y="87" font-size="9" fill="#64748B" font-weight="500" text-anchor="middle">‹   • • •   ›</text>

        <!-- Élément carousel 3 -->
        <rect x="260" y="42" width="112" height="54" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <rect x="268" y="50" width="96" height="22" rx="4" fill="#ECFDF5" />
        <text x="316" y="65" font-size="9" fill="#334155" font-weight="600" text-anchor="middle">Session K8s</text>
        <text x="316" y="87" font-size="9" fill="#64748B" font-weight="500" text-anchor="middle">‹   • • •   ›</text>
      </g>
    </g>

    <!-- RANGÉE 2 (y = 345) -->
    <g id="Row_2">
      <!-- Carte 4 : Chart -->
      <g id="Card_Chart" transform="translate(64, 345)">
        <use href="#card-shell" />
        <text x="16" y="23" class="card-title">Chart</text>
        <text x="16" y="43" font-size="9" fill="#64748B" font-weight="600">Sessions par jour</text>

        <!-- Barres du graphique -->
        <rect x="30" y="78" width="18" height="20" rx="3" fill="#38BDF8" />
        <rect x="56" y="64" width="18" height="34" rx="3" fill="#38BDF8" />
        <rect x="82" y="72" width="18" height="26" rx="3" fill="#38BDF8" />
        <rect x="108" y="54" width="18" height="44" rx="3" fill="#38BDF8" />
        <rect x="134" y="60" width="18" height="38" rx="3" fill="#38BDF8" />
        <rect x="160" y="46" width="18" height="52" rx="3" fill="#38BDF8" />
        <rect x="186" y="52" width="18" height="46" rx="3" fill="#38BDF8" />
        <line x1="16" y1="98" x2="404" y2="98" stroke="#E2E8F0" stroke-width="1" />
      </g>

      <!-- Carte 5 : Progress -->
      <g id="Card_Progress" transform="translate(510, 345)">
        <use href="#card-shell" />
        <text x="16" y="23" class="card-title">Progress</text>

        <text x="16" y="52" font-size="9.5" fill="#475569" font-weight="600">Rotation des secrets</text>
        <rect x="16" y="62" width="280" height="10" rx="5" fill="#E2E8F0" />
        <rect x="16" y="62" width="196" height="10" rx="5" fill="#2563EB" />
        <text x="310" y="71" font-size="10" fill="#2563EB" font-weight="700">70 %</text>
      </g>

      <!-- Carte 6 : Sonner -->
      <g id="Card_Sonner" transform="translate(956, 345)">
        <use href="#card-shell" />
        <text x="16" y="23" class="card-title">Sonner</text>

        <rect x="44" y="40" width="300" height="54" rx="7" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
        <circle cx="62" cy="58" r="7" fill="#047857" />
        <text x="78" y="61" font-size="9.5" fill="#0F172A" font-weight="700">Modification enregistrée</text>
        <text x="78" y="77" font-size="9" fill="#64748B" font-weight="500">Les paramètres ont été mis à jour.</text>
      </g>
    </g>

    <!-- RANGÉE 3 (y = 469) -->
    <g id="Row_3">
      <!-- Carte 7 : Table -->
      <g id="Card_Table" transform="translate(64, 469)">
        <use href="#card-shell" />
        <text x="16" y="23" class="card-title">Table</text>

        <rect x="16" y="40" width="388" height="60" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <rect x="16" y="40" width="388" height="18" rx="5" fill="#F8FAFC" />
        <text x="24" y="53" font-size="8" fill="#64748B" font-weight="700">RESSOURCE</text>
        <text x="180" y="53" font-size="8" fill="#64748B" font-weight="700">PROTOCOLE</text>
        <text x="310" y="53" font-size="8" fill="#64748B" font-weight="700">ÉTAT</text>
        <line x1="16" y1="58" x2="404" y2="58" stroke="#E2E8F0" stroke-width="1" />

        <text x="24" y="76" font-size="9" fill="#334155" font-weight="600">srv-prod-01</text>
        <text x="180" y="76" font-size="9" fill="#334155" font-weight="500">SSH</text>
        <rect x="310" y="64" width="46" height="18" rx="4" fill="#ECFDF5" />
        <text x="333" y="77" font-size="9" fill="#047857" font-weight="600" text-anchor="middle">Actif</text>

        <line x1="16" y1="83" x2="404" y2="83" stroke="#E2E8F0" stroke-width="1" />
        <text x="24" y="96" font-size="9" fill="#334155" font-weight="500">db-primary</text>
        <text x="180" y="96" font-size="9" fill="#334155" font-weight="500">PostgreSQL</text>
        <rect x="310" y="86" width="46" height="18" rx="4" fill="#ECFDF5" />
        <text x="333" y="99" font-size="9" fill="#047857" font-weight="600" text-anchor="middle">Actif</text>
      </g>

      <!-- Carte 8 : Toast -->
      <g id="Card_Toast" transform="translate(510, 469)">
        <use href="#card-shell" />
        <text x="16" y="23" class="card-title">Toast</text>

        <rect x="44" y="40" width="300" height="54" rx="7" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
        <circle cx="62" cy="58" r="7" fill="#047857" />
        <text x="78" y="61" font-size="9.5" fill="#0F172A" font-weight="700">Session terminée</text>
        <text x="78" y="77" font-size="9" fill="#64748B" font-weight="500">L’enregistrement est disponible.</text>
        <text x="324" y="60" font-size="13" fill="#94A3B8" font-weight="500">×</text>
      </g>

      <!-- Carte 9 : Toaster -->
      <g id="Card_Toaster" transform="translate(956, 469)">
        <use href="#card-shell" />
        <text x="16" y="23" class="card-title">Toaster</text>

        <rect x="180" y="38" width="210" height="60" rx="7" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
        <text x="192" y="55" font-size="9.5" fill="#0F172A" font-weight="700">Centre de notifications</text>
        <rect x="192" y="62" width="74" height="18" rx="4" fill="#DBEAFE" />
        <text x="229" y="75" font-size="9" fill="#1D4ED8" font-weight="600" text-anchor="middle">1 nouvelle</text>
        <text x="192" y="88" font-size="8" fill="#64748B" font-weight="500">Position : bas droite</text>
      </g>
    </g>
  </g>

  <!-- Pied de page -->
  <g id="Layer_Footer">
    <line x1="64" y1="634" x2="1376" y2="634" stroke="#E2E8F0" stroke-width="1" />
    <text x="64" y="652" class="footer-text">OPENBASTION · UI KIT / PR #223 · DOCUMENT DE TRAVAIL</text>
    <text x="1376" y="652" class="footer-text" text-anchor="end">04f-donnees-retours-systeme.svg</text>
  </g>
</svg>