<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="682" viewBox="0 0 1440 682" role="img" aria-labelledby="title desc">
  <title id="title">OpenBastion — Champs &amp; formulaires</title>
  <desc id="desc">Composants de saisie, formulaires et validation des données. Planche de composants illustratifs alignés sur les références UI du projet.</desc>

  <defs>
    <style>
      svg {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .brand-kicker { fill: #2563EB; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
      .page-title { fill: #0F172A; font-size: 34px; font-weight: 700; }
      .page-subtitle { fill: #64748B; font-size: 15px; font-weight: 400; }
      .section-label { fill: #2563EB; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
      .card-bg { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
      .card-title { fill: #0F172A; font-size: 12px; font-weight: 700; }
      .card-tag { fill: #94A3B8; font-size: 8px; font-weight: 700; text-anchor: end; }
      .card-divider { stroke: #F1F5F9; stroke-width: 1; }
      .field-label { fill: #475569; font-size: 9.5px; font-weight: 600; }
      .input-box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .input-placeholder { fill: #94A3B8; font-size: 9.5px; font-weight: 400; }
      .input-value { fill: #334155; font-size: 9.5px; font-weight: 500; }
      .helper-text { fill: #64748B; font-size: 9.5px; font-weight: 500; }
      .footer-text { fill: #64748B; font-size: 9px; font-weight: 500; }
    </style>

    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>

    <!-- Gabarit de carte standard (421.33 x 112 pour 3 colonnes exactes sur 1312px utiles) -->
    <g id="card-shell">
      <rect width="420" height="112" rx="8" class="card-bg" filter="url(#cardShadow)" />
      <line x1="16" y1="31" x2="404" y2="31" class="card-divider" />
      <text x="404" y="22" class="card-tag">UI COMPONENT</text>
    </g>
  </defs>

  <!-- Arrière-plan et bandeau supérieur -->
  <g id="Layer_Background">
    <rect width="1440" height="682" fill="#F8FAFC" />
  </g>
  <g id="Layer_BrandChrome">
    <rect width="1440" height="10" fill="#0D2137" />
  </g>

  <!-- En-tête de planche -->
  <g id="Layer_Header">
    <text x="64" y="62" class="brand-kicker">OPENBASTION / DESIGN SYSTEM</text>
    <text x="64" y="116" class="page-title">Champs &amp; formulaires</text>
    <text x="64" y="148" class="page-subtitle">Champs, saisie et formulaires · composants illustratifs alignés sur les références</text>
  </g>

  <!-- Contenu principal : Grille 3 colonnes (x = 64, 510, 956 | largeur carte = 420 | gouttière = 26) -->
  <g id="Layer_Content">
    <!-- Séparateur de section -->
    <g id="Section_Header">
      <text x="64" y="207" class="section-label">CHAMPS &amp; FORMULAIRES</text>
      <line x1="220" y1="203" x2="1376" y2="203" stroke="#E2E8F0" stroke-width="1" />
    </g>

    <!-- RANGÉE 1 (y = 221) -->
    <g id="Row_1">
      <!-- Carte 1 : Calendar -->
      <g id="Card_Calendar" transform="translate(64, 221)">
        <use href="#card-shell" />
        <text x="16" y="23" class="card-title">Calendar</text>
        <rect x="16" y="39" width="196" height="57" rx="6" class="input-box" />
        <text x="28" y="56" font-size="10" fill="#0F172A" font-weight="700">Novembre 2026</text>
        <text x="28" y="75" font-size="8" fill="#94A3B8" font-weight="600" letter-spacing="1.5">L  M  M  J  V  S  D</text>
        <text x="28" y="89" font-size="9.5" fill="#475569" font-weight="500">16  17  18  19  20  21  22</text>
        <rect x="228" y="57" width="94" height="22" rx="11" fill="#EFF6FF" />
        <text x="275" y="71" font-size="9.5" fill="#2563EB" font-weight="600" text-anchor="middle">17 nov. 2026</text>
      </g>

      <!-- Carte 2 : Form -->
      <g id="Card_Form" transform="translate(510, 221)">
        <use href="#card-shell" />
        <text x="16" y="23" class="card-title">Form</text>

        <text x="16" y="45" class="field-label">Nom de la ressource</text>
        <rect x="16" y="52" width="186" height="25" rx="6" class="input-box" />
        <text x="26" y="68" class="input-placeholder">srv-production-01</text>

        <text x="218" y="45" class="field-label">Environnement</text>
        <rect x="218" y="52" width="186" height="25" rx="6" class="input-box" />
        <text x="228" y="68" class="input-placeholder">Production</text>
        <text x="392" y="68" font-size="11" fill="#64748B" text-anchor="end">⌄</text>

        <rect x="218" y="84" width="90" height="20" rx="10" fill="#FFFBEB" />
        <text x="263" y="97" font-size="9.5" fill="#B45309" font-weight="600" text-anchor="middle">Champ requis</text>
      </g>

      <!-- Carte 3 : Input -->
      <g id="Card_Input" transform="translate(956, 221)">
        <use href="#card-shell" />
        <text x="16" y="23" class="card-title">Input</text>

        <text x="16" y="49" class="field-label">Nom d’utilisateur</text>
        <rect x="16" y="57" width="224" height="26" rx="6" class="input-box" />
        <text x="26" y="74" class="input-placeholder">camille.martin</text>

        <text x="256" y="49" class="field-label">Recherche</text>
        <rect x="256" y="57" width="148" height="26" rx="6" class="input-box" />
        <text x="266" y="74" class="input-placeholder">Filtrer…</text>
      </g>
    </g>

    <!-- RANGÉE 2 (y = 345) -->
    <g id="Row_2">
      <!-- Carte 4 : InputOTP -->
      <g id="Card_InputOTP" transform="translate(64, 345)">
        <use href="#card-shell" />
        <text x="16" y="23" class="card-title">InputOTP</text>

        <g transform="translate(16, 49)">
          <rect x="0" y="0" width="34" height="38" rx="6" class="input-box" />
          <text x="17" y="24" font-size="15" fill="#2563EB" font-weight="700" text-anchor="middle">•</text>

          <rect x="42" y="0" width="34" height="38" rx="6" class="input-box" />
          <text x="59" y="24" font-size="15" fill="#2563EB" font-weight="700" text-anchor="middle">•</text>

          <rect x="84" y="0" width="34" height="38" rx="6" class="input-box" />
          <text x="101" y="24" font-size="15" fill="#2563EB" font-weight="700" text-anchor="middle">•</text>

          <rect x="126" y="0" width="34" height="38" rx="6" class="input-box" />
          <text x="143" y="24" font-size="15" fill="#2563EB" font-weight="700" text-anchor="middle">•</text>

          <rect x="168" y="0" width="34" height="38" rx="6" class="input-box" />
          <text x="185" y="24" font-size="15" fill="#2563EB" font-weight="700" text-anchor="middle">•</text>

          <rect x="210" y="0" width="34" height="38" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2" />
          <line x1="227" y1="11" x2="227" y2="27" stroke="#2563EB" stroke-width="1.5" />

          <text x="264" y="23" class="helper-text">Code à 6 chiffres</text>
        </g>
      </g>

      <!-- Carte 5 : Label -->
      <g id="Card_Label" transform="translate(510, 345)">
        <use href="#card-shell" />
        <text x="16" y="23" class="card-title">Label</text>

        <text x="16" y="61" font-size="10.5" fill="#334155" font-weight="600">Identifiant du compte <tspan fill="#DC2626" font-weight="700">*</tspan></text>
        <text x="16" y="81" class="helper-text">Libellé associé au champ · obligatoire</text>
      </g>

      <!-- Carte 6 : Select -->
      <g id="Card_Select" transform="translate(956, 345)">
        <use href="#card-shell" />
        <text x="16" y="23" class="card-title">Select</text>

        <text x="16" y="51" class="field-label">Protocole</text>
        <rect x="16" y="59" width="186" height="26" rx="6" class="input-box" />
        <text x="26" y="76" font-size="9.5" fill="#334155" font-weight="600">SSH</text>
        <text x="190" y="76" font-size="11" fill="#64748B" text-anchor="end">⌄</text>

        <text x="218" y="51" class="field-label">Compte cible</text>
        <rect x="218" y="59" width="186" height="26" rx="6" class="input-box" />
        <text x="228" y="76" class="input-value">Administrateur</text>
        <text x="392" y="76" font-size="11" fill="#64748B" text-anchor="end">⌄</text>
      </g>
    </g>

    <!-- RANGÉE 3 (y = 469, centrée sur la colonne médiane x = 510) -->
    <g id="Row_3">
      <!-- Carte 7 : Textarea -->
      <g id="Card_Textarea" transform="translate(510, 469)">
        <use href="#card-shell" />
        <text x="16" y="23" class="card-title">Textarea</text>

        <text x="16" y="48" class="field-label">Justification</text>
        <rect x="16" y="56" width="388" height="40" rx="6" class="input-box" />
        <text x="26" y="73" font-size="9.5" fill="#94A3B8" font-weight="500">Intervention planifiée sur le serveur…</text>
        <text x="26" y="88" font-size="8.5" fill="#94A3B8" font-weight="400">Contexte et référence de ticket</text>
      </g>
    </g>
  </g>

  <!-- Pied de page -->
  <g id="Layer_Footer">
    <line x1="64" y1="634" x2="1376" y2="634" stroke="#E2E8F0" stroke-width="1" />
    <text x="64" y="652" class="footer-text">OPENBASTION · UI KIT / PR #223 · DOCUMENT DE TRAVAIL</text>
    <text x="1376" y="652" class="footer-text" text-anchor="end">04c-champs-formulaires.svg</text>
  </g>
</svg>