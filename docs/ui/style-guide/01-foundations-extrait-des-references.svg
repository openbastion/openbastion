    <text x="90" y="1120" fill="#B45309" font-size="10.5" font-weight="600">Écart avec e368900 : styles.css définit sidebar 16rem (256 px), rayons 4/6/8 px et espacements 4/8/12/16/20/24 px.</text>
    <text x="90" y="1134" fill="#64748B" font-size="9.5">Les tokens actuels sont conservés comme état d’implémentation ; leur convergence avec les mesures sources attend validation.</text>
