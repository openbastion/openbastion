    <text x="90" y="1100" font-size="11" fill="#B45309" font-weight="600">Arbitrage : 232 px est la référence dominante des écrans métier ; 240 px est conservé comme variante Sessions tant qu’une normalisation explicite n’est pas validée.</text>
