<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1200" width="1440" height="1200" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Responsive — couverture des références</title>
  <desc id="desc">Constat documentaire : les onze écrans de référence sont desktop. Aucune maquette tablette ou mobile source ne permet de mesurer ou de spécifier ces variantes.</desc>
  <defs>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
  </defs>
  <g id="Layer_Background">
    <rect width="1440" height="1200" fill="#F8FAFC" />
  </g>
  <g id="Layer_BrandChrome">
    <rect width="1440" height="10" fill="#0D2137" />
  </g>
  <g id="Layer_Header" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="64" y="62" font-size="12" fill="#2563EB" font-weight="700">OPENBASTION / UI REFERENCE ALIGNMENT</text>
    <text x="64" y="116" font-size="34" fill="#0F172A" font-weight="700">Responsive — couverture des références</text>
    <text x="64" y="148" font-size="15" fill="#64748B" font-weight="400">Constat mesuré, sans extrapolation des formats absents</text>
  </g>
  <g id="Layer_Content" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="64" y="190" width="1312" height="430" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
    <text x="88" y="226" font-size="16" fill="#0F172A" font-weight="700">01 / Desktop — références disponibles</text>
    <text x="88" y="250" font-size="12" fill="#64748B" font-weight="400">Les 11 écrans sources utilisent un viewBox de 1440 px de large.</text>
    <rect x="92" y="282" width="380" height="240" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="110" y="312" font-size="13" fill="#0F172A" font-weight="700">Écrans métier</text>
    <text x="110" y="338" font-size="11" fill="#64748B" font-weight="400">Dashboard · Accès · Audit · Infrastructure</text>
    <rect x="110" y="370" width="97.44" height="92" rx="4" fill="#0D2137" stroke="#0D2137" stroke-width="1" />
    <rect x="207.44" y="370" width="212.56" height="14" rx="2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <rect x="207.44" y="384" width="212.56" height="78" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="110" y="492" font-size="11" fill="#64748B" font-weight="400">Sidebar : 232 px  ·  Topbar : 64 px</text>
    <rect x="510" y="282" width="380" height="240" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="528" y="312" font-size="13" fill="#0F172A" font-weight="700">Écrans Sessions</text>
    <text x="528" y="338" font-size="11" fill="#64748B" font-weight="400">Sessions · Historique · Enregistrements · Alertes</text>
    <rect x="528" y="370" width="100.8" height="92" rx="4" fill="#0D2137" stroke="#0D2137" stroke-width="1" />
    <rect x="628.8" y="370" width="209.2" height="14" rx="2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <rect x="628.8" y="384" width="209.2" height="78" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="528" y="492" font-size="11" fill="#64748B" font-weight="400">Sidebar : 240 px  ·  Topbar : 64 px</text>
    <rect x="928" y="282" width="380" height="240" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="946" y="312" font-size="13" fill="#0F172A" font-weight="700">Authentification</text>
    <text x="946" y="338" font-size="11" fill="#64748B" font-weight="400">Connexion · Validation MFA</text>
    <rect x="946" y="370" width="344" height="92" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="964" y="410" font-size="13" fill="#0F172A" font-weight="700">1440 × 1024</text>
    <text x="964" y="436" font-size="11" fill="#64748B" font-weight="400">Connexion et MFA</text>
    <text x="946" y="492" font-size="11" fill="#64748B" font-weight="400">Écrans dédiés, hors shell métier</text>
    <rect x="64" y="650" width="632" height="300" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
    <text x="88" y="686" font-size="16" fill="#0F172A" font-weight="700">02 / Tablette — aucune référence source</text>
    <text x="88" y="724" font-size="13" fill="#64748B" font-weight="400">Aucun SVG fourni ne décrit une largeur tablette.</text>
    <text x="88" y="770" font-size="12" fill="#0F172A" font-weight="700">Non mesurable dans le corpus</text>
    <text x="88" y="800" font-size="11" fill="#64748B" font-weight="400">Breakpoint · navigation · reflow · densité des tableaux</text>
    <text x="88" y="824" font-size="11" fill="#64748B" font-weight="400">À spécifier séparément ; aucune règle visuelle n’est déduite ici.</text>
    <rect x="720" y="650" width="656" height="300" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
    <text x="744" y="686" font-size="16" fill="#0F172A" font-weight="700">03 / Mobile — aucune référence source</text>
    <text x="744" y="724" font-size="13" fill="#64748B" font-weight="400">Aucun SVG fourni ne décrit une largeur mobile.</text>
    <text x="744" y="770" font-size="12" fill="#0F172A" font-weight="700">Non mesurable dans le corpus</text>
    <text x="744" y="800" font-size="11" fill="#64748B" font-weight="400">Navigation compacte · cartes · interactions tactiles</text>
    <text x="744" y="824" font-size="11" fill="#64748B" font-weight="400">À concevoir et valider avant toute implémentation responsive.</text>
    <rect x="64" y="980" width="1312" height="100" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="88" y="1018" font-size="13" fill="#0F172A" font-weight="700">Règle de conformité</text>
    <text x="88" y="1046" font-size="11" fill="#64748B" font-weight="400">Les mesures 232 / 240 px et 64 px sont limitées aux écrans où elles sont observées. Aucun breakpoint ni comportement tablette/mobile</text>
    <text x="88" y="1066" font-size="11" fill="#64748B" font-weight="400">n’est ajouté au style guide sans référence visuelle ou décision de conception validée.</text>
  </g>
  <g id="Layer_Footer" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <line x1="64" y1="1140" x2="1376" y2="1140" stroke="#E2E8F0" stroke-width="1" />
    <text x="64" y="1170" font-size="11" fill="#64748B" font-weight="400">OPENBASTION · DESIGN SYSTEM / DOCUMENT DE TRAVAIL</text>
    <text x="1376" y="1170" font-size="11" fill="#64748B" font-weight="400">PR #223 · FEAT/UI-REFERENCE-ALIGNMENT · NON FUSIONNÉE</text>
  </g>
</svg>