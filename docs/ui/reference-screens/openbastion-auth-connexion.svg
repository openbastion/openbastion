<svg width="1440" height="1024" viewBox="0 0 1440 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-inter { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .t-regular { font-weight: 400; }
      .t-medium { font-weight: 500; }
      .t-semibold { font-weight: 600; }
      .t-bold { font-weight: 700; }
    </style>
  </defs>

  <!-- ===================================================================== -->
  <!-- CALQUE 1 : ARRIÈRE-PLAN GLOBAL                                        -->
  <!-- ===================================================================== -->
  <g id="Background-Global">
    <rect width="1440" height="1024" fill="#F8FAFC"/>
  </g>

  <!-- ===================================================================== -->
  <!-- CALQUE 2 : PANNEAU GAUCHE (BRANDING & SÉCURITÉ)                       -->
  <!-- ===================================================================== -->
  <g id="Left-Panel">
    <rect width="560" height="1024" fill="#0B192C"/>

    <!-- Logo OpenBastion -->
    <g id="Brand-Logo">
      <path d="M76 58L63 63.5V73.5C63 81.8 68.5 89.2 76 91C83.5 89.2 89 81.8 89 73.5V63.5L76 58Z" fill="#FFFFFF"/>
      <path d="M76 62L69 65V71C69 75.5 72 79.5 76 80.5C80 79.5 83 75.5 83 71V65L76 62Z" fill="#38BDF8"/>
      <circle cx="76" cy="70.5" r="2" fill="#0B192C"/>
      <path d="M76 72.5V75.5" stroke="#0B192C" stroke-width="1.8" stroke-linecap="round"/>

      <text x="110" y="80" fill="#FFFFFF" class="font-inter t-bold" font-size="22">OpenBastion</text>
      <text x="110" y="99" fill="#8A9BB0" class="font-inter t-semibold" font-size="9.5" letter-spacing="0.06em">PRIVILEGED ACCESS</text>
    </g>

    <!-- Titre et accroche principale -->
    <g id="Hero-Copy">
      <text x="56" y="264" fill="#0EA5E9" class="font-inter t-bold" font-size="10.5" letter-spacing="0.06em">SECURE ACCESS. TOTAL CONTROL.</text>

      <text x="56" y="334" fill="#FFFFFF" class="font-inter t-bold" font-size="38" letter-spacing="-0.02em">Vos accès privilégiés.</text>
      <text x="56" y="390" fill="#FFFFFF" class="font-inter t-bold" font-size="38" letter-spacing="-0.02em">La confiance en plus.</text>

      <text x="56" y="446" fill="#94A3B8" class="font-inter t-regular" font-size="15">Un point d'entrée unique pour vos infrastructures.</text>
      <text x="56" y="468" fill="#94A3B8" class="font-inter t-regular" font-size="15">Chaque identité vérifiée, chaque session protégée.</text>
    </g>

    <!-- Carte : La sécurité, à chaque connexion -->
    <g id="Security-Features-Card">
      <rect x="56" y="558" width="448" height="200" rx="10" fill="#13263E"/>

      <!-- Icône Bouclier -->
      <path d="M96 588L85 592.5V600.5C85 607.5 89.7 613.7 96 615.2C102.3 613.7 107 607.5 107 600.5V592.5L96 588Z" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
      <text x="120" y="601" fill="#FFFFFF" class="font-inter t-semibold" font-size="15">La sécurité, à chaque connexion</text>

      <!-- Liste des points -->
      <text x="80" y="652" fill="#CBD5E1" class="font-inter t-regular" font-size="13.5">Authentification multifacteur obligatoire</text>
      <text x="80" y="686" fill="#CBD5E1" class="font-inter t-regular" font-size="13.5">Sessions chiffrées et intégralement tracées</text>
      <text x="80" y="720" fill="#CBD5E1" class="font-inter t-regular" font-size="13.5">Accès limités au strict nécessaire</text>
    </g>

    <!-- Pied de page panneau gauche -->
    <g id="Left-Panel-Footer">
      <text x="56" y="896" fill="#CBD5E1" class="font-inter t-semibold" font-size="11" letter-spacing="0.04em">PRODUCTION  /  ACME CORPORATION</text>
      <text x="56" y="927" fill="#64748B" class="font-inter t-regular" font-size="11.5">v2.8.0  •  Hébergé en Union européenne</text>
      <text x="56" y="980" fill="#64748B" class="font-inter t-regular" font-size="11.5">© 2026 OpenBastion — GNU Affero General Public License v3.0 (AGPL-3.0-only)</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- CALQUE 3 : PANNEAU DROIT (FORMULAIRE DE CONNEXION)                    -->
  <!-- ===================================================================== -->
  <g id="Right-Panel">
    <!-- Sélecteur de langue en haut à droite -->
    <g id="Language-Selector">
      <text x="1332" y="52" text-anchor="end" fill="#64748B" class="font-inter t-regular" font-size="12">Français  ·  FR</text>
    </g>

    <!-- Conteneur central du formulaire (x=780 à 1220, largeur=440) -->
    <g id="Login-Form-Container">
      <!-- En-tête du formulaire -->
      <text x="780" y="166" fill="#0F62FE" class="font-inter t-bold" font-size="11" letter-spacing="0.05em">ACCÈS SÉCURISÉ</text>
      <text x="780" y="220" fill="#0F172A" class="font-inter t-bold" font-size="30" letter-spacing="-0.02em">Connexion à OpenBastion</text>
      <text x="780" y="253" fill="#64748B" class="font-inter t-regular" font-size="14">Accédez à votre espace de travail en toute sécurité.</text>

      <!-- Bouton SSO -->
      <g id="Button-SSO">
        <rect x="780" y="288" width="440" height="46" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
        <!-- Icône connexion -->
        <path d="M816 301H826C827.1 301 828 301.9 828 303V323C828 324.1 827.1 325 826 325H816" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M806 313H821M817 308.5L821.5 313L817 317.5" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="1000" y="316" text-anchor="middle" fill="#0F172A" class="font-inter t-semibold" font-size="13.5">Continuer avec le SSO entreprise</text>
      </g>

      <!-- Séparateur -->
      <g id="Divider-Or">
        <line x1="780" y1="370" x2="928" y2="370" stroke="#E2E8F0" stroke-width="1"/>
        <text x="1000" y="375" text-anchor="middle" fill="#64748B" class="font-inter t-regular" font-size="12">ou avec votre compte</text>
        <line x1="1072" y1="370" x2="1220" y2="370" stroke="#E2E8F0" stroke-width="1"/>
      </g>

      <!-- Champ : Adresse e-mail professionnelle -->
      <g id="Input-Email">
        <text x="780" y="417" fill="#0F172A" class="font-inter t-semibold" font-size="13">Adresse e-mail professionnelle</text>
        <rect x="780" y="431" width="440" height="46" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
        <text x="796" y="459" fill="#64748B" class="font-inter t-regular" font-size="14">camille.martin@acme.com</text>
      </g>

      <!-- Champ : Mot de passe -->
      <g id="Input-Password">
        <text x="780" y="518" fill="#0F172A" class="font-inter t-semibold" font-size="13">Mot de passe</text>
        <text x="1174" y="518" text-anchor="end" fill="#0F62FE" class="font-inter t-medium" font-size="12">Mot de passe oublié ?</text>

        <rect x="780" y="532" width="440" height="46" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
        <!-- Points de mot de passe masqué -->
        <g id="Password-Dots" fill="#0F172A">
          <circle cx="800" cy="555" r="2.5"/>
          <circle cx="810" cy="555" r="2.5"/>
          <circle cx="820" cy="555" r="2.5"/>
          <circle cx="830" cy="555" r="2.5"/>
          <circle cx="840" cy="555" r="2.5"/>
          <circle cx="850" cy="555" r="2.5"/>
          <circle cx="860" cy="555" r="2.5"/>
          <circle cx="870" cy="555" r="2.5"/>
          <circle cx="880" cy="555" r="2.5"/>
          <circle cx="890" cy="555" r="2.5"/>
          <circle cx="900" cy="555" r="2.5"/>
        </g>
        <text x="1190" y="559" text-anchor="end" fill="#0F62FE" class="font-inter t-medium" font-size="12">Afficher</text>
      </g>

      <!-- Case à cocher : Se souvenir de mon adresse e-mail -->
      <g id="Checkbox-Remember">
        <rect x="780" y="601" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
        <text x="807" y="613" fill="#64748B" class="font-inter t-regular" font-size="12.5">Se souvenir de mon adresse e-mail</text>
      </g>

      <!-- Bouton principal : Se connecter -->
      <g id="Button-Submit">
        <rect x="780" y="646" width="440" height="48" rx="8" fill="#0F62FE"/>
        <text x="1000" y="675" text-anchor="middle" fill="#FFFFFF" class="font-inter t-semibold" font-size="14.5">Se connecter</text>
      </g>

      <!-- Encart d'information MFA en bas du formulaire -->
      <g id="MFA-Info-Banner">
        <rect x="780" y="726" width="440" height="82" rx="10" fill="#EBF2FE"/>
        <!-- Icône Bouclier -->
        <path d="M812 746L801 750.5V758.5C801 765.5 805.7 771.7 812 773.2C818.3 771.7 823 765.5 823 758.5V750.5L812 746Z" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/>
        <text x="832" y="757" fill="#475569" class="font-inter t-regular" font-size="12.5">Une vérification supplémentaire vous sera demandée</text>
        <text x="832" y="774" fill="#475569" class="font-inter t-regular" font-size="12.5">pour protéger votre compte.</text>
      </g>
    </g>

    <!-- Pied de page panneau droit -->
    <g id="Right-Panel-Footer">
      <line x1="780" y1="886" x2="1220" y2="886" stroke="#E2E8F0" stroke-width="1"/>

      <text x="896" y="944" text-anchor="middle" fill="#64748B" class="font-inter t-regular" font-size="12">Besoin d'aide ?</text>
      <text x="1040" y="944" text-anchor="middle" fill="#64748B" class="font-inter t-medium" font-size="12">Contactez votre administrateur</text>

      <text x="738" y="982" text-anchor="middle" fill="#64748B" class="font-inter t-regular" font-size="11.5">Confidentialité</text>
      <text x="792" y="982" text-anchor="middle" fill="#CBD5E1" class="font-inter t-regular" font-size="11.5">·</text>
      <text x="868" y="982" text-anchor="middle" fill="#64748B" class="font-inter t-regular" font-size="11.5">Conditions d'utilisation</text>
      <text x="942" y="982" text-anchor="middle" fill="#CBD5E1" class="font-inter t-regular" font-size="11.5">·</text>
      <text x="1039" y="982" text-anchor="middle" fill="#64748B" class="font-inter t-regular" font-size="11.5">Code source (révision v0.0.1)</text>
      <text x="1135" y="982" text-anchor="middle" fill="#CBD5E1" class="font-inter t-regular" font-size="11.5">·</text>
      <text x="1205" y="982" text-anchor="middle" fill="#64748B" class="font-inter t-regular" font-size="11.5">Texte de la licence</text>
    </g>
  </g>
</svg>
