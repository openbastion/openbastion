      .dark-card-title { font-size: 17px; font-weight: 700; fill: #FFFFFF; }
      .dark-label { font-size: 12.5px; font-weight: 400; fill: #94A3B8; }
      .dark-value { font-size: 12.5px; font-weight: 600; fill: #F8FAFC; }
      .link-cyan { font-size: 12.5px; font-weight: 600; fill: #38BDF8; }
      .link-blue { font-size: 12.5px; font-weight: 600; fill: #2563EB; }
    </style>
