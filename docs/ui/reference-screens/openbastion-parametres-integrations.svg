<g id="Layer_MainContent" transform="translate(264,256)"><g id="Column_Left"><g transform="translate(0,0)" filter="url(#cardShadow)"><rect x="0" y="0" width="744" height="258" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="24" y="38" class="font-sans card-title">Gestion des clés &amp; secrets</text><text x="24" y="61" class="font-sans card-subtitle">Intégrations réellement prises en charge par les services du bastion.</text><circle cx="43" cy="96" r="17" fill="#EFF6FF"/><text x="43" y="101" text-anchor="middle" class="font-sans" font-size="13" font-weight="700" fill="#2563EB">VT</text><text x="72" y="92" class="font-sans toggle-title">HashiCorp Vault / OpenBao Transit</text><text x="72" y="113" class="font-sans toggle-desc">Scellement des secrets du Password Vault et enveloppes de clés de session des enregistrements.</text><rect x="572" y="83" width="130" height="24" rx="6" fill="#ECFDF5" stroke="#D1FAE5"/><text x="637.0" y="99" text-anchor="middle" class="font-sans" font-size="11.5" font-weight="600" fill="#047857">INTÉGRÉ</text><line x1="24" y1="138" x2="720" y2="138" stroke="#F1F5F9"/><circle cx="43" cy="168" r="17" fill="#EFF6FF"/><text x="43" y="173" text-anchor="middle" class="font-sans" font-size="13" font-weight="700" fill="#2563EB">KV</text><text x="72" y="164" class="font-sans toggle-title">Password Vault</text><text x="72" y="185" class="font-sans toggle-desc">Comptes SSH, injection côté proxy et rotation manuelle, planifiée ou après usage.</text><rect x="572" y="155" width="130" height="24" rx="6" fill="#ECFDF5" stroke="#D1FAE5"/><text x="637.0" y="171" text-anchor="middle" class="font-sans" font-size="11.5" font-weight="600" fill="#047857">INTÉGRÉ</text><text x="24" y="232" class="font-sans helper-text">Les valeurs secrètes restent dans les fichiers protégés / gestionnaire externe, jamais dans l’UI.</text></g><g transform="translate(0,274)" filter="url(#cardShadow)"><rect x="0" y="0" width="744" height="282" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="24" y="38" class="font-sans card-title">Messageries &amp; webhooks</text><text x="24" y="61" class="font-sans card-subtitle">Canaux sortants pour les alertes d’audit et les demandes d’approbation.</text><circle cx="43" cy="92" r="17" fill="#EFF6FF"/><text x="43" y="97" text-anchor="middle" class="font-sans" font-size="13" font-weight="700" fill="#2563EB">G</text><text x="72" y="88" class="font-sans toggle-title">Webhook générique</text><text x="72" y="109" class="font-sans toggle-desc">Audit signé HMAC-SHA256 ; signature optionnelle côté Broker.</text><rect x="572" y="79" width="130" height="24" rx="6" fill="#ECFDF5" stroke="#D1FAE5"/><text x="637.0" y="95" text-anchor="middle" class="font-sans" font-size="11.5" font-weight="600" fill="#047857">SUPPORTÉ</text><line x1="24" y1="132" x2="720" y2="132" stroke="#F1F5F9"/><circle cx="43" cy="162" r="17" fill="#EFF6FF"/><text x="43" y="167" text-anchor="middle" class="font-sans" font-size="13" font-weight="700" fill="#2563EB">S</text><text x="72" y="158" class="font-sans toggle-title">Slack</text><text x="72" y="179" class="font-sans toggle-desc">Webhook entrant au format text ; URL traitée comme un secret.</text><rect x="572" y="149" width="130" height="24" rx="6" fill="#ECFDF5" stroke="#D1FAE5"/><text x="637.0" y="165" text-anchor="middle" class="font-sans" font-size="11.5" font-weight="600" fill="#047857">SUPPORTÉ</text><line x1="24" y1="202" x2="720" y2="202" stroke="#F1F5F9"/><circle cx="43" cy="232" r="17" fill="#EFF6FF"/><text x="43" y="237" text-anchor="middle" class="font-sans" font-size="13" font-weight="700" fill="#2563EB">T</text><text x="72" y="228" class="font-sans toggle-title">Microsoft Teams</text><text x="72" y="249" class="font-sans toggle-desc">Carte adaptative via Workflows ; signature non vérifiée par le destinataire.</text><rect x="572" y="219" width="130" height="24" rx="6" fill="#ECFDF5" stroke="#D1FAE5"/><text x="637.0" y="235" text-anchor="middle" class="font-sans" font-size="11.5" font-weight="600" fill="#047857">SUPPORTÉ</text><text x="24" y="264" class="font-sans helper-text">Un canal par service ; Slack / Teams ne valident pas la signature ni les approbations.</text></g><g transform="translate(0,572)" filter="url(#cardShadow)"><rect x="0" y="0" width="744" height="128" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="24" y="38" class="font-sans card-title">Autres systèmes</text><text x="24" y="64" class="font-sans toggle-desc">Les protocoles d’accès passent par les proxys OpenBastion ; aucun connecteur</text><text x="24" y="84" class="font-sans helper-text">ServiceNow, Jira, SIEM universel, SMTP et catalogue d’intégrations UI : non livrés.</text></g></g><g id="Column_Right" transform="translate(768,0)"><g transform="translate(0,0)" filter="url(#cardShadow)"><rect x="0" y="0" width="378" height="216" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="24" y="38" class="font-sans card-title">Architecture des échanges</text><text x="24" y="61" class="font-sans card-subtitle">Les intégrations ne contournent pas les contrôles du bastion.</text><rect x="24" y="78" width="92" height="24" rx="6" fill="#ECFDF5" stroke="#D1FAE5"/><text x="70.0" y="94" text-anchor="middle" class="font-sans" font-size="11.5" font-weight="600" fill="#047857">TLS / mTLS</text><text x="24" y="124" class="font-sans dark-label">Services internes</text><text x="180" y="124" class="font-sans label-sm">mTLS en production</text><text x="24" y="158" class="font-sans dark-label">Webhooks</text><text x="180" y="158" class="font-sans label-sm">HTTPS + signature</text><text x="24" y="190" class="font-sans helper-text">Pas de redirection HTTP suivie.</text></g><g transform="translate(0,240)" filter="url(#cardShadow)"><rect x="0" y="0" width="378" height="216" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="24" y="38" class="font-sans card-title">Secrets de connexion</text><text x="24" y="84" class="font-sans label-sm">URL webhook</text><text x="24" y="104" class="font-sans helper-text">Secret — jamais journalisée</text><text x="24" y="142" class="font-sans label-sm">Clé HMAC</text><text x="24" y="162" class="font-sans helper-text">32 octets minimum</text><text x="24" y="196" class="font-sans helper-text">Valeurs fournies hors UI par fichiers protégés / gestionnaire de secrets.</text></g><g transform="translate(0,480)"><rect x="0" y="0" width="378" height="160" rx="12" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1"/><text x="18" y="32" class="font-sans toggle-title">À propos des webhooks</text><text x="18" y="62" class="font-sans toggle-desc">La notification est un rappel, pas une preuve.</text><text x="18" y="84" class="font-sans toggle-desc">La chaîne d’audit reste la source de vérité.</text><text x="18" y="118" class="font-sans helper-text">Les livraisons échouées sont réessayées</text><text x="18" y="136" class="font-sans helper-text">selon la politique de chaque service.</text></g></g></g>
